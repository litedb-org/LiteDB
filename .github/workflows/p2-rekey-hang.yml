name: Phase 2 Shared publication hang stress

on:
  workflow_call:
    inputs:
      iterations:
        description: Full collection repetitions per platform
        type: string
        default: '200'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  stress:
    name: Shared publication (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86-net9, os: windows-latest, arch: x86 }
          - { name: windows-x64-net9, os: windows-latest, arch: x64 }
          - { name: linux-x64-net9, os: ubuntu-latest, arch: x64 }
          - { name: linux-arm64-net9, os: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Build hook-enabled tests
        run: dotnet build LiteDB.Tests/LiteDB.Tests.csproj -c Release -f net8.0 -p:TestingEnabled=true
      - name: Repeat the exact SharedOneFilePublication collection
        shell: pwsh
        env:
          ITERATIONS: ${{ inputs.iterations }}
          STRESS_ARCH: ${{ matrix.arch }}
          LITEDB_SHARED_EXPECT_TEMP_VOLUME: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $count = [int]$env:ITERATIONS
          if ($count -lt 1 -or $count -gt 1000) { throw 'Iterations must be 1..1000.' }
          $classes = @(Get-ChildItem LiteDB.Tests -Filter '*.cs' -Recurse | ForEach-Object {
            $source = Get-Content $_.FullName -Raw
            if ($source -match '\[Collection\("SharedOneFilePublication"\)\]' -and $source -match 'class\s+(\w+)') {
              "FullyQualifiedName~LiteDB.Internals.$($Matches[1])."
            }
          } | Sort-Object -Unique)
          if ($classes.Count -ne 33) { throw "Unexpected collection class count: $($classes.Count)" }
          $filter = $classes -join '|'
          New-Item -ItemType Directory -Force LiteDB.Tests/TestResults | Out-Null
          $classes | Set-Content LiteDB.Tests/TestResults/collection-filter.txt
          git rev-parse HEAD | Set-Content LiteDB.Tests/TestResults/tested-sha.txt
          $runtime = Join-Path $env:RUNNER_TEMP "litedb-runtime-9-$env:STRESS_ARCH"
          $collectionCount = if ($IsLinux -and $env:STRESS_ARCH -eq 'x64') { [Math]::Min(5, $count) } else { [Math]::Min(50, $count) }
          for ($iteration = 1; $iteration -le $collectionCount; $iteration++) {
            "START $iteration $(Get-Date -Format o)" | Tee-Object -FilePath LiteDB.Tests/TestResults/iterations.txt -Append
            $options = @{
              RuntimeMajor = 9; Framework = 'net8.0'; Architecture = $env:STRESS_ARCH
              Filter = $filter; ResultFile = "iteration-$iteration.trx"; HangTimeoutSeconds = 60
            }
            if ($iteration -gt 1) { $options.RuntimeDirectory = $runtime }
            ./scripts/run-ci-tests.ps1 @options
            if ($LASTEXITCODE -ne 0) { throw "Iteration $iteration failed with exit $LASTEXITCODE" }
            "PASS $iteration $(Get-Date -Format o)" | Tee-Object -FilePath LiteDB.Tests/TestResults/iterations.txt -Append
          }
          for ($iteration = 1; $iteration -le $count; $iteration++) {
            "REKEY START $iteration $(Get-Date -Format o)" | Tee-Object -FilePath LiteDB.Tests/TestResults/iterations.txt -Append
            ./scripts/run-ci-tests.ps1 -RuntimeMajor 9 -Framework net8.0 -Architecture $env:STRESS_ARCH `
              -RuntimeDirectory $runtime -HangTimeoutSeconds 60 `
              -Filter 'FullyQualifiedName~Legacy_Shared_replacement_retains_native_entry_and_idle_peers_reopen_the_new_core' `
              -ResultFile "rekey-$iteration.trx"
            if ($LASTEXITCODE -ne 0) { throw "Rekey iteration $iteration failed." }
            "REKEY PASS $iteration $(Get-Date -Format o)" | Tee-Object -FilePath LiteDB.Tests/TestResults/iterations.txt -Append
          }
      - name: Validate surrounding Shared and callback coverage
        shell: pwsh
        env:
          STRESS_ARCH: ${{ matrix.arch }}
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP "litedb-runtime-9-$env:STRESS_ARCH"
          $filters = @(
            'FullyQualifiedName~LiteDB.Internals.Shared&FullyQualifiedName!~Process',
            'FullyQualifiedName~LiteDB.Internals.Shared&FullyQualifiedName~Process',
            'FullyQualifiedName~LiteDB.Tests.Engine.Shared'
          )
          for ($part = 0; $part -lt $filters.Count; $part++) {
            ./scripts/run-ci-tests.ps1 -RuntimeMajor 9 -Framework net8.0 -Architecture $env:STRESS_ARCH `
              -RuntimeDirectory $runtime -Filter $filters[$part] -ResultFile "surrounding-shared-$part.trx"
            if ($LASTEXITCODE -ne 0) { throw "Surrounding Shared partition $part failed." }
          }
      - name: Analyze captured hang on matching architecture
        if: failure() && matrix.arch != 'x86'
        shell: pwsh
        run: |
          dotnet tool install dotnet-dump --tool-path ./dump-tools
          $tool = if ($IsWindows) { './dump-tools/dotnet-dump.exe' } else { './dump-tools/dotnet-dump' }
          Get-ChildItem LiteDB.Tests/TestResults -Filter '*hangdump.dmp' -Recurse | Select-Object -First 1 | ForEach-Object {
            & $tool analyze $_.FullName -c 'clrthreads' -c 'clrstack -all' -c 'syncblk' -c 'exit' 2>&1 | Tee-Object LiteDB.Tests/TestResults/hang-stacks.txt
          }
      - name: Upload all sequences, dumps, results and iteration counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-rekey-hang-${{ matrix.name }}
          path: LiteDB.Tests/TestResults/
          retention-days: 14
      - name: Upload matching managed binaries and symbols after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p2-rekey-binaries-${{ matrix.name }}
          path: |
            LiteDB.Tests/bin/Release/net8.0/
            ${{ runner.temp }}/litedb-runtime-9-${{ matrix.arch }}/shared/Microsoft.NETCore.App/
          retention-days: 14

  analyze-existing:
    name: Analyze original dump (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64-net9, os: windows-latest }
          - { name: linux-arm64-net9, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: p2-rekey-hang-${{ matrix.name }}
          run-id: 42340434768
          github-token: ${{ github.token }}
          path: captured
      - name: Analyze captured dump
        shell: pwsh
        run: |
          dotnet tool install dotnet-dump --tool-path ./dump-tools
          $tool = if ($IsWindows) { './dump-tools/dotnet-dump.exe' } else { './dump-tools/dotnet-dump' }
          Get-ChildItem captured -Filter '*hangdump.dmp' -Recurse | Select-Object -First 1 | ForEach-Object {
            & $tool analyze $_.FullName -c 'clrthreads' -c 'clrstack -all' -c 'syncblk' -c 'exit' 2>&1 | Tee-Object hang-stacks.txt
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-stacks-${{ matrix.name }}
          path: hang-stacks.txt
