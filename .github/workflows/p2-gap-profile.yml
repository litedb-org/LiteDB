name: Phase 2 gap profile
on:
  workflow_dispatch:
  push:
    branches: [v6/wip-p2-bulk-gap]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, framework: net8.0}
          - {runner: ubuntu-24.04, framework: net10.0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: a981cc228e99037e5ea2513899c771b9bed28482
          path: artifacts_temp/before
      - uses: actions/checkout@v4
        with:
          ref: 36b77dd0d3c823b3b0a78baa9e37b27e3ae9011e
          path: artifacts_temp/after
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Count native syncs per Direct commit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y strace
          python tools/Ab5021Benchmarks/p2-native-sync.py '${{ matrix.framework }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-gap-profile-${{ matrix.runner }}-${{ matrix.framework }}
          path: artifacts_temp/p2-profile/
          if-no-files-found: warn
