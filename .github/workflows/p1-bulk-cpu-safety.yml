name: P1 bulk CPU safety
on:
  workflow_dispatch:
  push:
    branches: [v6/p1-bulk-cpu]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Numeric IDs, transaction and shared-owner regressions
        shell: pwsh
        run: |
          dotnet test LiteDB.Tests -c Release -f '${{ matrix.framework }}' -p:TestingEnabled=true -p:GitVersionEnabled=false --settings tests.runsettings --filter 'FullyQualifiedName~SequenceCounter_Tests|FullyQualifiedName~AutoId|FullyQualifiedName~Transactions_Tests|FullyQualifiedName~DirectProcessHost|FullyQualifiedName~Collection_Tests' --logger 'trx;LogFileName=sequence.trx' --results-directory artifacts_temp/bulk-safety
          if ($LASTEXITCODE) { throw 'Sequence safety failed' }
      - name: WAL failure, power loss and checksum recovery
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          dotnet test LiteDB.Tests -c Release -f '${{ matrix.framework }}' -p:TestingEnabled=true -p:GitVersionEnabled=false --settings tests.runsettings --filter 'FullyQualifiedName~WalPowerLoss_Tests|FullyQualifiedName~WalCombinedPowerLoss_Tests|FullyQualifiedName~WalWriteFailureWindow_Tests|FullyQualifiedName~ChecksumStorageModel_Tests|FullyQualifiedName~GroupCommitFailure_Tests' --logger 'trx;LogFileName=faults.trx' --results-directory artifacts_temp/bulk-safety
          if ($LASTEXITCODE) { throw 'Fault safety failed' }
      - name: Independent recovery and transaction models
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          dotnet run --project LiteDB.Fuzz -c Release -f '${{ matrix.framework }}' -p:TestingEnabled=true -p:GitVersionEnabled=false -- --target transaction,power-loss,recovery,checksum-crash --seed 203021 --count 40 --artifact-dir artifacts_temp/bulk-fuzz
          if ($LASTEXITCODE) { throw 'Recovery fuzz failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bulk-safety-${{ matrix.os }}-${{ matrix.framework }}
          path: |
            artifacts_temp/bulk-safety
            artifacts_temp/bulk-fuzz
