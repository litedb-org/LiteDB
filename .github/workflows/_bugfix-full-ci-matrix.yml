name: Bugfix Full CI Matrix

on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
      evidence-definition-sha:
        required: true
        type: string
      issue:
        required: false
        type: string
        default: ''
      validation-scope:
        required: false
        type: string
        default: single-issue
      quarantine-sha256:
        required: true
        type: string
      harness-overlay-manifest-sha256:
        required: true
        type: string
      issue-2825-harness-overlay-manifest-sha256:
        required: false
        type: string
        default: ''
      final-integration-sha:
        required: false
        type: string
        default: ''
      accepted-state-sha:
        required: false
        type: string
        default: ''
      accepted-ledger-sha256:
        required: false
        type: string
        default: ''
      test-source-sha:
        required: false
        type: string
        default: ''
      sdk-matrix:
        required: false
        type: string
        default: |
          [
            { "key": "net8",  "display": ".NET 8",  "sdk": "8.0.x",        "framework": "net8.0",  "includePrerelease": false, "msbuildProps": "" },
            { "key": "net9",  "display": ".NET 9",  "sdk": "9.0.x\n8.0.x", "framework": "net8.0",  "includePrerelease": true,  "msbuildProps": "" },
            { "key": "net10", "display": ".NET 10", "sdk": "10.0.x",       "framework": "net10.0", "includePrerelease": false, "msbuildProps": "" }
          ]

jobs:
  build:
    name: Build (${{ matrix.platform.display }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { key: linux, display: Linux, runner: ubuntu-latest }
          - { key: macos, display: macOS, runner: macos-latest }
          - { key: windows, display: Windows, runner: windows-latest }
    steps:
      - name: Check out pinned source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-sha }}

      - name: Verify pinned source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Check changed C# file sizes
        if: matrix.platform.key == 'linux'
        env:
          BASE_SHA: ${{ inputs.source-sha }}^
        run: python scripts/check-csharp-size.py --base "${BASE_SHA}"

      - name: Restore
        run: dotnet restore LiteDB.sln

      - name: Build
        run: dotnet build LiteDB.sln --configuration Release --no-restore /p:TestingEnabled=true

      - name: Verify vector file compatibility with LiteDB 5.0.21
        if: matrix.platform.key == 'linux'
        run: python3 scripts/test-vector-compatibility.py

      - name: Build memory validation runner
        if: matrix.platform.key == 'linux'
        run: dotnet build tools/MemoryValidation/MemoryValidation.csproj --configuration Release

      - name: Build memory profile measurements
        if: matrix.platform.key == 'linux'
        run: dotnet build tools/MemoryProfiles/MemoryProfiles.csproj --configuration Release

      - name: Package Unix build outputs
        if: matrix.platform.key != 'windows'
        shell: bash
        run: tar -czf tests-build-${{ matrix.platform.key }}.tar.gz LiteDB/bin/Release LiteDB/obj/Release LiteDB.Tests/bin/Release LiteDB.Tests/obj/Release

      - name: Upload Unix test build
        if: matrix.platform.key != 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: tests-build-${{ matrix.platform.key }}
          path: tests-build-${{ matrix.platform.key }}.tar.gz

      - name: Upload Windows test build
        if: matrix.platform.key == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: tests-build-windows
          path: |
            LiteDB/bin/Release
            LiteDB/obj/Release
            LiteDB.Tests/bin/Release
            LiteDB.Tests/obj/Release

      - name: Write provenance
        if: matrix.platform.key == 'linux'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          EVIDENCE_DEFINITION_SHA: ${{ inputs.evidence-definition-sha }}
          ISSUE: ${{ inputs.issue }}
          QUARANTINE_SHA256: ${{ inputs.quarantine-sha256 }}
          HARNESS_OVERLAY_MANIFEST_SHA256: ${{ inputs.harness-overlay-manifest-sha256 }}
          ISSUE_2825_HARNESS_OVERLAY_MANIFEST_SHA256: ${{ inputs.issue-2825-harness-overlay-manifest-sha256 }}
          VALIDATION_SCOPE: ${{ inputs.validation-scope }}
          FINAL_INTEGRATION_SHA: ${{ inputs.final-integration-sha }}
          ACCEPTED_STATE_SHA: ${{ inputs.accepted-state-sha }}
          ACCEPTED_LEDGER_SHA256: ${{ inputs.accepted-ledger-sha256 }}
          TEST_SOURCE_SHA: ${{ inputs.test-source-sha }}
        run: |
          test "${GITHUB_WORKFLOW_SHA}" = "${EVIDENCE_DEFINITION_SHA}"
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          scope = os.environ["VALIDATION_SCOPE"]
          if scope == "single-issue":
              if not re.fullmatch(r"[1-9][0-9]*", os.environ["ISSUE"]):
                  raise SystemExit("Single-issue capture requires a positive issue")
              if any(os.environ[name] for name in (
                      "FINAL_INTEGRATION_SHA", "ACCEPTED_STATE_SHA",
                      "ACCEPTED_LEDGER_SHA256", "TEST_SOURCE_SHA")):
                  raise SystemExit("Single-issue capture has final-promotion inputs")
              identity = {"kind": scope, "issue": int(os.environ["ISSUE"])}
          elif scope == "final-promotion":
              if os.environ["ISSUE"]:
                  raise SystemExit("Final-promotion capture cannot name one issue")
              for name in ("FINAL_INTEGRATION_SHA", "ACCEPTED_STATE_SHA", "TEST_SOURCE_SHA"):
                  if not re.fullmatch(r"[0-9a-f]{40}", os.environ[name]):
                      raise SystemExit(f"Invalid final-promotion SHA: {name}")
              if not re.fullmatch(r"[0-9a-f]{64}", os.environ["ACCEPTED_LEDGER_SHA256"]):
                  raise SystemExit("Invalid accepted ledger digest")
              identity = {
                  "kind": scope,
                  "final_integration_sha": os.environ["FINAL_INTEGRATION_SHA"],
                  "accepted_state_sha": os.environ["ACCEPTED_STATE_SHA"],
                  "accepted_ledger_sha256": os.environ["ACCEPTED_LEDGER_SHA256"],
                  "test_source_sha": os.environ["TEST_SOURCE_SHA"],
              }
          else:
              raise SystemExit("Unsupported validation scope")
          evidence = {
              "schema_version": 4,
              "validation": identity,
              "source_sha": os.environ["SOURCE_SHA"],
              "checkout_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True).strip(),
              "evidence_definition_sha": os.environ["EVIDENCE_DEFINITION_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "quarantine_sha256": os.environ["QUARANTINE_SHA256"],
              "harness_overlay_manifest_sha256": os.environ[
                  "HARNESS_OVERLAY_MANIFEST_SHA256"],
              "issue_2825_harness_overlay_manifest_sha256": os.environ[
                  "ISSUE_2825_HARNESS_OVERLAY_MANIFEST_SHA256"],
          }
          with open("full-ci-provenance.json", "w", encoding="utf-8") as output:
              json.dump(evidence, output, indent=2)
              output.write("\n")
          PY

      - name: Upload provenance
        if: matrix.platform.key == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bugfix-full-ci-provenance
          path: full-ci-provenance.json
          if-no-files-found: error

  test:
    name: ${{ format(matrix.platform.job_name, matrix.item.display) }}
    runs-on: ${{ matrix.platform.runner }}
    needs: build
    env:
      LITEDB_TEST_ARCH: ${{ matrix.platform.arch }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { key: linux, runner: ubuntu-latest, build: linux, archive: true, job_name: 'Test (Linux {0})', result: TestResults.trx }
          - { key: linux-arm64, runner: ubuntu-latest, build: linux, archive: true, arm64: true, job_name: 'Test (Linux ARM64 - {0})', result: TestResults-arm64.trx }
          - { key: macos, runner: macos-latest, build: macos, archive: true, job_name: 'Test (macOS {0})', result: TestResults.trx }
          - { key: windows-latest-x64, runner: windows-latest, build: windows, arch: x64, job_name: 'Test (Windows windows-latest - x64 - {0})', result: TestResults-x64.trx }
          - { key: windows-latest-x86, runner: windows-latest, build: windows, arch: x86, job_name: 'Test (Windows windows-latest - x86 - {0})', result: TestResults-x86.trx }
          - { key: windows-2022-x64, runner: windows-2022, build: windows, arch: x64, job_name: 'Test (Windows windows-2022 - x64 - {0})', result: TestResults-x64.trx }
          - { key: windows-2022-x86, runner: windows-2022, build: windows, arch: x86, job_name: 'Test (Windows windows-2022 - x86 - {0})', result: TestResults-x86.trx }
        item: ${{ fromJson(inputs.sdk-matrix) }}
    steps:
      - name: Check out pinned source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-sha }}

      - name: Verify pinned source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Set up QEMU for ARM64 emulation
        if: matrix.platform.arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up .NET SDK ${{ matrix.item.display }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.item.sdk }}
          include-prerelease: ${{ matrix.item.includePrerelease }}

      - name: Install x86 test runtime
        if: matrix.platform.arch == 'x86'
        shell: pwsh
        run: ./.github/scripts/install-x86-test-runtime.ps1 -Framework '${{ matrix.item.framework }}'

      - name: Download test build
        uses: actions/download-artifact@v4
        with:
          name: tests-build-${{ matrix.platform.build }}
          path: .

      - name: Extract Unix build artifacts
        if: matrix.platform.archive
        shell: bash
        run: tar -xzf tests-build-${{ matrix.platform.build }}.tar.gz

      - name: Build test project for target framework
        run: >-
          dotnet build LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --framework ${{ matrix.item.framework }}
          ${{ matrix.platform.arch && format('--arch {0} -p:AppendRuntimeIdentifierToOutputPath=false', matrix.platform.arch) || '' }}
          --no-dependencies
          -p:TestingEnabled=true
          ${{ matrix.item.msbuildProps }}

      - name: Discover exact test inventory
        shell: bash
        run: |
          set -o pipefail
          mkdir -p full-ci-evidence
          dotnet test LiteDB.Tests/LiteDB.Tests.csproj \
            --configuration Release --no-build --framework ${{ matrix.item.framework }} \
            ${{ matrix.platform.arch && format('--arch {0} -p:AppendRuntimeIdentifierToOutputPath=false', matrix.platform.arch) || '' }} \
            --settings tests.runsettings --list-tests ${{ matrix.item.msbuildProps }} \
            | tee full-ci-evidence/discovery.txt

      - name: Run tests
        timeout-minutes: 5
        run: >-
          dotnet test LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --no-build
          --framework ${{ matrix.item.framework }}
          ${{ matrix.platform.arch && format('--arch {0} -p:AppendRuntimeIdentifierToOutputPath=false', matrix.platform.arch) || '' }}
          --verbosity normal
          --settings tests.runsettings
          --diag full-ci-evidence/vstest-diag.txt
          --logger "trx;LogFileName=${{ matrix.platform.result }}"
          --logger "console;verbosity=detailed"
          ${{ matrix.item.msbuildProps }}

      - name: Record actual test runtime architecture
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          EVIDENCE_DEFINITION_SHA: ${{ inputs.evidence-definition-sha }}
          PLATFORM_KEY: ${{ matrix.platform.key }}
          FRAMEWORK: ${{ matrix.item.framework }}
        run: |
          mkdir -p full-ci-evidence
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import re
          import subprocess

          diagnostic_path = "full-ci-evidence/vstest-diag.txt"
          with open(diagnostic_path, "rb") as source:
              diagnostic = source.read()
          target_architectures = set(re.findall(
              rb"DotnetTestHostmanager\.GetTestHostProcessStartInfo: .*?"
              rb"target architecture '([A-Za-z0-9_]+)'", diagnostic))
          if len(target_architectures) != 1:
              raise SystemExit("VSTest did not report one testhost target architecture")
          info = subprocess.check_output(
              ["dotnet", "--info"], text=True, errors="strict")
          architectures = re.findall(r"^\s*Architecture:\s*(\S+)\s*$",
                                     info, flags=re.MULTILINE)
          if not architectures:
              raise SystemExit("dotnet --info did not report its host architecture")
          evidence = {
              "schema_version": 1,
              "source_sha": os.environ["SOURCE_SHA"],
              "evidence_definition_sha": os.environ["EVIDENCE_DEFINITION_SHA"],
              "platform_key": os.environ["PLATFORM_KEY"],
              "framework": os.environ["FRAMEWORK"],
              "runner_os": platform.system(),
              "runner_architecture": platform.machine(),
              "dotnet_host_architecture": architectures[0],
              "vstest_target_architecture": target_architectures.pop().decode("ascii"),
              "vstest_diagnostic_sha256": hashlib.sha256(diagnostic).hexdigest(),
          }
          with open("full-ci-evidence/runtime.json", "w",
                    encoding="utf-8", newline="\n") as output:
              json.dump(evidence, output, indent=2)
              output.write("\n")
          PY

      - name: Upload exact test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bugfix-full-ci-tests-${{ matrix.platform.key }}-${{ matrix.item.key }}
          path: |
            full-ci-evidence/discovery.txt
            full-ci-evidence/runtime.json
            full-ci-evidence/vstest-diag.txt
            LiteDB.Tests/TestResults/${{ matrix.platform.result }}
          if-no-files-found: warn

  test-windows-crossprocess:
    name: Cross-Process Tests (Windows ${{ matrix.platform.runner }} - ${{ matrix.platform.arch }} - ${{ matrix.item.display }})
    runs-on: ${{ matrix.platform.runner }}
    needs: build
    env:
      LITEDB_TEST_ARCH: ${{ matrix.platform.arch }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { key: windows-latest-x64, runner: windows-latest, arch: x64 }
          - { key: windows-latest-x86, runner: windows-latest, arch: x86 }
          - { key: windows-2022-x64, runner: windows-2022, arch: x64 }
          - { key: windows-2022-x86, runner: windows-2022, arch: x86 }
        item: ${{ fromJson(inputs.sdk-matrix) }}
    steps:
      - name: Check out pinned source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-sha }}

      - name: Verify pinned source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Set up .NET SDK ${{ matrix.item.display }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.item.sdk }}
          include-prerelease: ${{ matrix.item.includePrerelease }}

      - name: Install x86 test runtime
        if: matrix.platform.arch == 'x86'
        shell: pwsh
        run: ./.github/scripts/install-x86-test-runtime.ps1 -Framework '${{ matrix.item.framework }}'

      - name: Download test build
        uses: actions/download-artifact@v4
        with:
          name: tests-build-windows
          path: .

      - name: Build test project for target framework (${{ matrix.platform.arch }})
        run: >-
          dotnet build LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --framework ${{ matrix.item.framework }}
          --arch ${{ matrix.platform.arch }} -p:AppendRuntimeIdentifierToOutputPath=false
          --no-dependencies
          -p:TestingEnabled=true
          ${{ matrix.item.msbuildProps }}

      - name: Discover exact cross-process inventory
        shell: bash
        run: |
          set -o pipefail
          mkdir -p full-ci-evidence
          dotnet test LiteDB.Tests/LiteDB.Tests.csproj \
            --configuration Release --no-build --framework ${{ matrix.item.framework }} \
            --arch ${{ matrix.platform.arch }} -p:AppendRuntimeIdentifierToOutputPath=false \
            --settings tests.runsettings --filter "FullyQualifiedName~CrossProcess_Shared_Tests|FullyQualifiedName~Issue2904_Tests.Actual_test_host_matches_requested_architecture" \
            --list-tests ${{ matrix.item.msbuildProps }} | tee full-ci-evidence/discovery.txt

      - name: Run cross-process shared mode tests (${{ matrix.platform.arch }})
        timeout-minutes: 10
        run: >-
          dotnet test LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --no-build
          --framework ${{ matrix.item.framework }}
          --arch ${{ matrix.platform.arch }} -p:AppendRuntimeIdentifierToOutputPath=false
          --filter "FullyQualifiedName~CrossProcess_Shared_Tests|FullyQualifiedName~Issue2904_Tests.Actual_test_host_matches_requested_architecture"
          --verbosity normal
          --logger "trx;LogFileName=CrossProcessTestResults-${{ matrix.platform.arch }}.trx"
          --logger "console;verbosity=detailed"
          ${{ matrix.item.msbuildProps }}

      - name: Upload exact cross-process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bugfix-full-ci-crossprocess-${{ matrix.platform.key }}-${{ matrix.item.key }}
          path: |
            full-ci-evidence/discovery.txt
            LiteDB.Tests/TestResults/CrossProcessTestResults-${{ matrix.platform.arch }}.trx
          if-no-files-found: warn
