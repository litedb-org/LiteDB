name: Phase 1 speed profile
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Optional instrumented library ref (empty uses workflow head)
        default: ''
        required: false
        type: string
      trace_run:
        description: 'Decode retained captures from this run without repeating workloads (empty = capture)'
        default: ''
        required: false
        type: string
  # Register this diagnostic workflow without changing the default branch.
  push:
    branches: ['v6/p1-speed-profile', 'v6/p1-perf-group', 'v6/p1-perf-group-handle']
permissions:
  contents: read
  actions: read
jobs:
  profile:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        if: inputs.candidate_ref != ''
        with:
          ref: ${{ inputs.candidate_ref }}
          path: artifacts_temp/profile-candidate
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build diagnostic production harnesses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global dotnet-trace --version 8.0.547301
          if ($LASTEXITCODE) { throw 'trace tool install failed' }
          $candidateArgs = @()
          if ('${{ inputs.candidate_ref }}') {
            $candidate = (Resolve-Path 'artifacts_temp/profile-candidate/LiteDB/LiteDB.csproj').Path
            $candidateArgs += "-p:CandidateProject=$candidate"
            $candidateSha = git -C artifacts_temp/profile-candidate rev-parse HEAD
          } else { $candidateSha = git rev-parse HEAD }
          "BENCHMARK_CANDIDATE_SHA=$candidateSha" >> $env:GITHUB_ENV
          foreach ($version in @('V6')) {
            dotnet build "tools/Ab5021Benchmarks/$version/$version.csproj" -c Release -f '${{ matrix.framework }}' '-p:TargetFrameworks=${{ matrix.framework }}' -p:TestingEnabled=false -p:ProfilingEnabled=true -p:GitVersionEnabled=false @candidateArgs --nologo
            if ($LASTEXITCODE) { throw "Build failed: $version" }
          }
          dotnet build tools/Ab5021Benchmarks/TraceReport/TraceReport.csproj -c Release -p:GitVersionEnabled=false --nologo
          if ($LASTEXITCODE) { throw 'trace report build failed' }
      - uses: actions/download-artifact@v4
        if: inputs.trace_run != ''
        with:
          run-id: ${{ inputs.trace_run }}
          github-token: ${{ github.token }}
          name: p1-speed-${{ matrix.os }}-${{ matrix.framework }}
          path: artifacts_temp/p1-speed/
      - name: Decode retained capture counters
        if: inputs.trace_run != ''
        shell: pwsh
        run: |
          dotnet tools/Ab5021Benchmarks/TraceReport/bin/Release/net8.0/TraceReport.dll artifacts_temp/p1-speed/dev-default.nettrace artifacts_temp/p1-speed/dev-default-frames.json --counters-only
          if ($LASTEXITCODE) { throw 'counter decode failed' }
          Remove-Item artifacts_temp/p1-speed/*.nettrace, artifacts_temp/p1-speed/*.etlx -ErrorAction SilentlyContinue
          '{"decoderSha":"${{ github.sha }}","captureRun":"${{ inputs.trace_run }}"}' | Set-Content artifacts_temp/p1-speed/decoder.json
      - name: Capture scenarios and decode counters
        if: inputs.trace_run == ''
        run: python tools/Ab5021Benchmarks/profile.py '${{ matrix.framework }}' artifacts_temp/p1-speed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-speed-${{ matrix.os }}-${{ matrix.framework }}
          path: artifacts_temp/p1-speed/
          if-no-files-found: warn
          retention-days: 14
