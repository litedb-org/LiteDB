name: Phase 1 benchmark gate

on:
  workflow_dispatch:
    inputs:
      shared_tenure_only:
        description: 'Only run the fork-only Phase 3-A mapped writer tenure comparison'
        required: false
        type: boolean
        default: false
      shared_open_close_only:
        description: 'Only run the fork-only Phase 2 mapped open/close comparison'
        required: false
        type: boolean
        default: false
      candidate_ref:
        description: 'Optional candidate library SHA/ref (empty uses this branch); harness always comes from workflow ref'
        required: false
        type: string
      candidate_repository:
        description: 'Repository for candidate_ref (empty uses this repository)'
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Bootstrap dispatch on the fork without installing this workflow on its dev branch.
  push:
    branches: ['v6/bench-gate']

permissions:
  contents: read

jobs:
  compare:
    if: >-
      inputs.shared_tenure_only != true && inputs.shared_open_close_only != true && (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.repository == 'JKamsker/LiteDB') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'benchmark')))
    name: Benchmark (${{ matrix.os }}, ${{ matrix.framework }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 29 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        framework: [net8.0, net10.0]
    steps:
      - name: Check out PR's own harness or selected workflow branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check out candidate production library separately
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.candidate_repository || github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ inputs.candidate_ref || github.event.pull_request.head.sha || github.sha }}
          path: artifacts_temp/candidate
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate gate evaluator
        run: python -m unittest discover -s .github/scripts -p test_benchmark_gate.py
      - name: Build identical production harnesses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = (Resolve-Path 'artifacts_temp/candidate/LiteDB/LiteDB.csproj').Path
          $candidateSha = git -C artifacts_temp/candidate rev-parse HEAD
          if ($LASTEXITCODE) { throw 'Cannot identify candidate' }
          "BENCHMARK_CANDIDATE_SHA=$candidateSha" >> $env:GITHUB_ENV
          $harnessSha = git rev-parse HEAD
          if ($LASTEXITCODE) { throw 'Cannot identify harness' }
          "BENCHMARK_HARNESS_SHA=$harnessSha" >> $env:GITHUB_ENV
          foreach ($version in @('V5', 'V6')) {
            dotnet build "tools/Ab5021Benchmarks/$version/$version.csproj" -c Release -f '${{ matrix.framework }}' '-p:TargetFrameworks=${{ matrix.framework }}' -p:TestingEnabled=false -p:GitVersionEnabled=false "-p:CandidateProject=$candidate" --nologo
            if ($LASTEXITCODE) { throw "Build failed: $version" }
          }
      - name: Interleaved configured-round A-B comparison
        run: python tools/Ab5021Benchmarks/run.py '${{ matrix.framework }}' 'artifacts_temp/ab-5021'
      - name: Evaluate per-scenario thresholds
        id: gate
        shell: pwsh
        run: |
          python .github/scripts/benchmark_gate.py artifacts_temp/ab-5021 --config tools/Ab5021Benchmarks/gate.json --os '${{ runner.os }}' --framework '${{ matrix.framework }}'
          $gateExit = $LASTEXITCODE
          if ($gateExit -eq 2) {
            Write-Output '::warning title=NOISY benchmark evidence::Inconclusive; rerun this OS/runtime. This is not a benchmark pass.'
            exit 0
          }
          exit $gateExit
      - name: Preserve measurements, gate results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-gate-${{ matrix.os }}-${{ matrix.framework }}
          path: artifacts_temp/ab-5021/
          if-no-files-found: warn
          retention-days: 30

  mapped-open-close:
    if: github.repository == 'JKamsker/LiteDB' && github.event_name == 'workflow_dispatch' && inputs.shared_open_close_only == true
    name: Mapped open-close (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.candidate_repository || github.repository }}
          ref: ${{ inputs.candidate_ref || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: litedb-org/LiteDB
          ref: a878a10c6cbb3f2fdf11815406a167b4c49ecaab
          path: baseline
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate timing evidence orchestration without measurements
        run: python -m unittest discover -s harness/.github/scripts -p test_shared_open_close.py
      - name: Build isolated production libraries and identical timing programs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C baseline rev-parse HEAD > evidence/base.txt
          git -C candidate rev-parse HEAD > evidence/head.txt
          git -C harness rev-parse HEAD > evidence/harness.txt
          dotnet --info > evidence/runtime.txt
          for variant in baseline candidate; do
            dotnet build "$variant/LiteDB/LiteDB.csproj" -c Release -f '${{ matrix.framework }}' '-p:TargetFrameworks=${{ matrix.framework }}' -p:TestingEnabled=false
            library="$GITHUB_WORKSPACE/$variant/LiteDB/bin/Release/${{ matrix.framework }}/LiteDB.dll"
            dotnet build harness/tools/SharedOpenCloseMeasurements -c Release -f '${{ matrix.framework }}' "-p:LiteDBAssembly=$library" -o "runner-$variant"
          done
      - name: Five serial alternating 50-cycle comparisons
        env:
          DOTNET_TieredCompilation: '0'
        shell: bash
        run: |
          set -euo pipefail
          python harness/tools/SharedOpenCloseMeasurements/run.py runner-baseline runner-candidate "$GITHUB_WORKSPACE/scratch" evidence "$(cat evidence/base.txt)" "$(cat evidence/head.txt)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mapped-open-close-${{ matrix.framework }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  mapped-writer-tenure:
    if: github.repository == 'JKamsker/LiteDB' && github.event_name == 'workflow_dispatch' && inputs.shared_tenure_only == true
    name: Mapped writer tenure (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.candidate_repository || github.repository }}
          ref: ${{ inputs.candidate_ref || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: litedb-org/LiteDB
          ref: 7d9975e30264973cb69a6d3c301212b10a3379fa
          path: baseline
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Validate tenure measurement orchestration without measurements
        run: python3 -m unittest discover -s candidate/.github/scripts -p test_shared_writer_tenure.py
      - name: Build isolated production libraries and identical candidate harnesses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C baseline rev-parse HEAD > evidence/base.txt
          git -C candidate rev-parse HEAD > evidence/head.txt
          dotnet --info > evidence/runtime.txt
          for variant in baseline candidate; do
            dotnet build "$variant/LiteDB/LiteDB.csproj" -c Release -f '${{ matrix.framework }}' '-p:TargetFrameworks=${{ matrix.framework }}' -p:TestingEnabled=false
            library="$GITHUB_WORKSPACE/$variant/LiteDB/bin/Release/${{ matrix.framework }}/LiteDB.dll"
            dotnet build candidate/tools/SharedWriterTenureMeasurements -c Release -f '${{ matrix.framework }}' "-p:LiteDBAssembly=$library" -o "runner-$variant"
          done
      - name: Five paired single-process throughput and alternating-writer latency rounds
        env:
          DOTNET_TieredCompilation: '0'
        shell: bash
        run: |
          set -euo pipefail
          timeout 10m python3 candidate/tools/SharedWriterTenureMeasurements/run.py runner-baseline runner-candidate scratch evidence | tee evidence/report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mapped-writer-tenure-${{ matrix.framework }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
