name: P1 checkpoint amortization experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        framework: [net8.0, net10.0]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build production and separate diagnostic harnesses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "BENCHMARK_CANDIDATE_SHA=$env:GITHUB_SHA" >> $env:GITHUB_ENV
          "BENCHMARK_HARNESS_SHA=$env:GITHUB_SHA" >> $env:GITHUB_ENV
          foreach ($v in @('V5', 'V6')) {
            dotnet build "tools/Ab5021Benchmarks/$v/$v.csproj" -c Release -f '${{ matrix.framework }}' '-p:TargetFrameworks=${{ matrix.framework }}' -p:TestingEnabled=false -p:GitVersionEnabled=false --nologo
            if ($LASTEXITCODE) { throw "build $v" }
          }
          # Preserve production binaries before building PROFILE into distinct output.
          dotnet build tools/Ab5021Benchmarks/V6/V6.csproj -c Release -f '${{ matrix.framework }}' '-p:TargetFrameworks=${{ matrix.framework }}' -p:TestingEnabled=false -p:GitVersionEnabled=false -p:ProfilingEnabled=true -o tools/Ab5021Benchmarks/Diagnostic --nologo
          if ($LASTEXITCODE) { throw 'diagnostic build' }
          dotnet build tools/Ab5021Benchmarks/V5/V5.csproj -c Release -f '${{ matrix.framework }}' '-p:TargetFrameworks=${{ matrix.framework }}' -p:ProfilingEnabled=true -o tools/Ab5021Benchmarks/DiagnosticV5 --nologo
          if ($LASTEXITCODE) { throw 'v5 diagnostic build' }
          dotnet build tools/Ab5021Benchmarks/V5Probe/V5Probe.csproj -c Release -f '${{ matrix.framework }}' '-p:TargetFrameworks=${{ matrix.framework }}' --nologo
          if ($LASTEXITCODE) { throw 'probe build' }
          dotnet build tools/Ab5021Benchmarks/CheckpointProbe/CheckpointProbe.csproj -c Release -f '${{ matrix.framework }}' '-p:TargetFrameworks=${{ matrix.framework }}' --nologo
          if ($LASTEXITCODE) { throw 'observer build' }
          Copy-Item tools/Ab5021Benchmarks/CheckpointProbe/bin/Release/${{ matrix.framework }}/CheckpointProbe.dll tools/Ab5021Benchmarks/DiagnosticV5/
          dotnet tools/Ab5021Benchmarks/V5Probe/bin/Release/${{ matrix.framework }}/V5Probe.dll tools/Ab5021Benchmarks/DiagnosticV5/LiteDB.dll tools/Ab5021Benchmarks/DiagnosticV5/CheckpointProbe.dll tools/Ab5021Benchmarks/DiagnosticV5/identity.json
          if ($LASTEXITCODE) { throw 'probe installation' }
      - name: Six interleaved GC-normalized rounds and real process-death recovery
        run: python tools/Ab5021Benchmarks/amortize.py '${{ matrix.framework }}' artifacts_temp/amortize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amortize-${{ matrix.os }}-${{ matrix.framework }}
          path: artifacts_temp/amortize
          retention-days: 30
