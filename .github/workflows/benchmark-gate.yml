name: Phase 1 benchmark gate

on:
  workflow_dispatch:
    inputs:
      shared_newcomer_only:
        description: 'Only run fork-only Linux x64 newcomer attach-to-writer-acquire p50/p99'
        required: false
        type: boolean
        default: false
      shared_tenure_only:
        description: 'Only run the fork-only Phase 3-A mapped writer tenure comparison'
        required: false
        type: boolean
        default: false
      shared_open_close_only:
        description: 'Only run the fork-only Phase 2 mapped open/close comparison'
        required: false
        type: boolean
        default: false
      slow_comparison:
        description: 'Allow 55 minutes for complete comparisons against a slow durable baseline; rounds and thresholds unchanged'
        required: false
        default: false
        type: boolean
      candidate_ref:
        description: 'Optional candidate library SHA/ref (empty uses this branch); harness always comes from workflow ref'
        required: false
        type: string
      baseline_ref:
        description: 'Optional before library SHA/ref; enables same-job v5/before/after comparison'
        required: false
        type: string
      comparison_scenarios:
        description: 'Optional comma-separated scenarios; requires baseline_ref and disables ALL gate verdicts'
        required: false
        type: string
      candidate_repository:
        description: 'Repository for candidate_ref (empty uses this repository)'
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Bootstrap dispatch on the fork without installing this workflow on its dev branch.
  push:
    branches: ['v6/bench-gate']

permissions:
  contents: read

jobs:
  compare:
    if: >-
      inputs.shared_newcomer_only != true && inputs.shared_tenure_only != true && inputs.shared_open_close_only != true && (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.repository == 'JKamsker/LiteDB') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'benchmark')))
    name: Research ${{ matrix.phase }} r${{ matrix.repetition }} (${{ matrix.os }}, ${{ matrix.framework }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: [net8.0, net10.0]
        phase: [phase2, phase3, phase4]
        repetition: [1, 2]
        include:
          - os: ubuntu-latest
            runner: ubuntu-24.04
            scenarios: open_close_20x,durable_insert_5k_1_writers,durable_insert_5k_8_writers
          - os: windows-latest
            runner: windows-2025
            scenarios: open_close_20x,full_scan_3x100k
          - phase: phase2
            before: a8727ffce5d11d8fb74a87c3dd6d2ce8e3d7def3
            after: 457cec42502e8d21c85c400ac35de447a56ebe9e
          - phase: phase3
            before: 457cec42502e8d21c85c400ac35de447a56ebe9e
            after: b70b79ec274c981a340da1af54104483d96fe351
          - phase: phase4
            before: b70b79ec274c981a340da1af54104483d96fe351
            after: e507faad40e968aa2fcf63ae6dd01fd7def2e07b
    steps:
      - name: Check out PR's own harness or selected workflow branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check out candidate production library separately
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.candidate_repository || github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ matrix.after || inputs.candidate_ref || github.event.pull_request.head.sha || github.sha }}
          path: artifacts_temp/candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Check out before production library separately
        if: always()
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.candidate_repository || github.repository }}
          ref: ${{ matrix.before }}
          path: artifacts_temp/before
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate gate evaluator
        run: python -m unittest discover -s .github/scripts -p test_benchmark_gate.py
      - name: Build identical production harnesses
        env:
          BASELINE_REF: ${{ matrix.before }}
          BENCHMARK_SCENARIOS: ${{ matrix.scenarios }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BENCHMARK_SCENARIOS -and -not $env:BASELINE_REF) {
            throw 'Scenario subsets require baseline_ref; gate runs must measure all scenarios'
          }
          if ($env:BASELINE_REF) {
            $before = (Resolve-Path 'artifacts_temp/before/LiteDB/LiteDB.csproj').Path
            $beforeSha = git -C artifacts_temp/before rev-parse HEAD
            if ($LASTEXITCODE) { throw 'Cannot identify before revision' }
            "BENCHMARK_BASELINE_SHA=$beforeSha" >> $env:GITHUB_ENV
            New-Item -ItemType Directory -Force tools/Ab5021Benchmarks/V6Before | Out-Null
            Copy-Item tools/Ab5021Benchmarks/V6/V6.csproj tools/Ab5021Benchmarks/V6Before/V6.csproj
            dotnet build tools/Ab5021Benchmarks/V6Before/V6.csproj -c Release -f '${{ matrix.framework }}' '-p:TargetFrameworks=${{ matrix.framework }}' -p:TestingEnabled=false -p:GitVersionEnabled=false "-p:CandidateProject=$before" -o tools/Ab5021Benchmarks/V6Before --nologo
            if ($LASTEXITCODE) { throw 'Build failed: before' }
          }
          $candidate = (Resolve-Path 'artifacts_temp/candidate/LiteDB/LiteDB.csproj').Path
          $candidateSha = git -C artifacts_temp/candidate rev-parse HEAD
          if ($LASTEXITCODE) { throw 'Cannot identify candidate' }
          "BENCHMARK_CANDIDATE_SHA=$candidateSha" >> $env:GITHUB_ENV
          $harnessSha = git rev-parse HEAD
          if ($LASTEXITCODE) { throw 'Cannot identify harness' }
          "BENCHMARK_HARNESS_SHA=$harnessSha" >> $env:GITHUB_ENV
          foreach ($version in @('V5', 'V6')) {
            dotnet build "tools/Ab5021Benchmarks/$version/$version.csproj" -c Release -f '${{ matrix.framework }}' '-p:TargetFrameworks=${{ matrix.framework }}' -p:TestingEnabled=false -p:GitVersionEnabled=false "-p:CandidateProject=$candidate" --nologo
            if ($LASTEXITCODE) { throw "Build failed: $version" }
          }
      - name: Interleaved configured-round A-B comparison
        env:
          BENCHMARK_SLOW_COMPARISON: ${{ inputs.slow_comparison }}
          BENCHMARK_SCENARIOS: ${{ matrix.scenarios }}
        run: python tools/Ab5021Benchmarks/run.py '${{ matrix.framework }}' 'artifacts_temp/ab-5021'
      - name: Evaluate per-scenario thresholds
        id: gate
        env:
          BENCHMARK_SCENARIOS: ${{ matrix.scenarios }}
        shell: pwsh
        run: |
          $comparisonArgs = @()
          if ($env:BENCHMARK_BASELINE_SHA) {
            $comparisonArgs += @('--baseline-sha', $env:BENCHMARK_BASELINE_SHA)
          }
          if ($env:BENCHMARK_SCENARIOS) {
            $comparisonArgs += @('--scenarios', $env:BENCHMARK_SCENARIOS)
          }
          python .github/scripts/benchmark_gate.py artifacts_temp/ab-5021 --config tools/Ab5021Benchmarks/gate.json --os '${{ runner.os }}' --framework '${{ matrix.framework }}' @comparisonArgs
          $gateExit = $LASTEXITCODE
          if ($gateExit -eq 2) {
            Write-Output '::warning title=NOISY benchmark evidence::Inconclusive; rerun this OS/runtime. This is not a benchmark pass.'
            exit 0
          }
          exit $gateExit
      - name: EventPipe profiles (separate from timings)
        if: matrix.phase == 'phase4' && matrix.repetition == 1 && matrix.framework == 'net10.0'
        shell: pwsh
        env:
          DOTNET_TieredCompilation: '0'
          BENCHMARK_SCENARIOS: ${{ matrix.scenarios }}
        run: |
          dotnet tool install --global dotnet-trace
          if ($LASTEXITCODE) { throw 'Trace tool installation failed' }
          foreach ($variant in @('before', 'after')) {
            $dll = if ($variant -eq 'before') { 'tools/Ab5021Benchmarks/V6Before/V6.dll' } else { 'tools/Ab5021Benchmarks/V6/bin/Release/${{ matrix.framework }}/V6.dll' }
            foreach ($scenario in ($env:BENCHMARK_SCENARIOS -split ',')) {
              if ($scenario -eq 'durable_insert_5k_1_writers') { continue }
              $env:PROFILE_SCENARIO = $scenario
              $trace = "artifacts_temp/ab-5021/$variant-$scenario.nettrace"
              dotnet-trace collect --profile cpu-sampling --output $trace -- dotnet $dll dev-default 1 unused.json
              if ($LASTEXITCODE) { throw 'Profile failed' }
              dotnet-trace report $trace topN -n 60 --inclusive | Out-File "$trace-top.txt"
              dotnet-trace convert $trace --format Speedscope
            }
          }
      - name: Preserve measurements, gate results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-${{ matrix.phase }}-r${{ matrix.repetition }}-${{ matrix.os }}-${{ matrix.framework }}
          path: artifacts_temp/ab-5021/
          if-no-files-found: warn
          retention-days: 30

  mapped-open-close:
    if: github.repository == 'JKamsker/LiteDB' && github.event_name == 'workflow_dispatch' && inputs.shared_open_close_only == true
    name: Mapped open-close (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.candidate_repository || github.repository }}
          ref: ${{ inputs.candidate_ref || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: litedb-org/LiteDB
          ref: a878a10c6cbb3f2fdf11815406a167b4c49ecaab
          path: baseline
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate timing evidence orchestration without measurements
        run: python -m unittest discover -s harness/.github/scripts -p test_shared_open_close.py
      - name: Build isolated production libraries and identical timing programs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C baseline rev-parse HEAD > evidence/base.txt
          git -C candidate rev-parse HEAD > evidence/head.txt
          git -C harness rev-parse HEAD > evidence/harness.txt
          dotnet --info > evidence/runtime.txt
          for variant in baseline candidate; do
            dotnet build "$variant/LiteDB/LiteDB.csproj" -c Release -f '${{ matrix.framework }}' '-p:TargetFrameworks=${{ matrix.framework }}' -p:TestingEnabled=false
            library="$GITHUB_WORKSPACE/$variant/LiteDB/bin/Release/${{ matrix.framework }}/LiteDB.dll"
            dotnet build harness/tools/SharedOpenCloseMeasurements -c Release -f '${{ matrix.framework }}' "-p:LiteDBAssembly=$library" -o "runner-$variant"
          done
      - name: Five serial alternating 50-cycle comparisons
        env:
          DOTNET_TieredCompilation: '0'
        shell: bash
        run: |
          set -euo pipefail
          python harness/tools/SharedOpenCloseMeasurements/run.py runner-baseline runner-candidate "$GITHUB_WORKSPACE/scratch" evidence "$(cat evidence/base.txt)" "$(cat evidence/head.txt)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mapped-open-close-${{ matrix.framework }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  mapped-writer-tenure:
    if: github.repository == 'JKamsker/LiteDB' && github.event_name == 'workflow_dispatch' && inputs.shared_tenure_only == true
    name: Mapped writer tenure (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.candidate_repository || github.repository }}
          ref: ${{ inputs.candidate_ref || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: litedb-org/LiteDB
          ref: 7d9975e30264973cb69a6d3c301212b10a3379fa
          path: baseline
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Validate tenure measurement orchestration without measurements
        run: python3 -m unittest discover -s candidate/.github/scripts -p test_shared_writer_tenure.py
      - name: Build isolated production libraries and identical candidate harnesses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C baseline rev-parse HEAD > evidence/base.txt
          git -C candidate rev-parse HEAD > evidence/head.txt
          dotnet --info > evidence/runtime.txt
          for variant in baseline candidate; do
            dotnet build "$variant/LiteDB/LiteDB.csproj" -c Release -f '${{ matrix.framework }}' '-p:TargetFrameworks=${{ matrix.framework }}' -p:TestingEnabled=false
            library="$GITHUB_WORKSPACE/$variant/LiteDB/bin/Release/${{ matrix.framework }}/LiteDB.dll"
            dotnet build candidate/tools/SharedWriterTenureMeasurements -c Release -f '${{ matrix.framework }}' "-p:LiteDBAssembly=$library" -o "runner-$variant"
          done
      - name: Five paired single-process throughput and alternating-writer latency rounds
        env:
          DOTNET_TieredCompilation: '0'
        shell: bash
        run: |
          set -euo pipefail
          timeout 10m python3 candidate/tools/SharedWriterTenureMeasurements/run.py runner-baseline runner-candidate scratch evidence | tee evidence/report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mapped-writer-tenure-${{ matrix.framework }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  mapped-newcomer:
    if: github.repository == 'JKamsker/LiteDB' && github.event_name == 'workflow_dispatch' && inputs.shared_newcomer_only == true
    name: Mapped newcomer (${{ matrix.framework }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.candidate_repository || github.repository }}
          ref: ${{ inputs.candidate_ref || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.candidate_repository || github.repository }}
          ref: ${{ inputs.baseline_ref || 'df6b16f80850d6f7ca072c2a685bf8bb2abd907a' }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate newcomer orchestration without measurements
        run: python3 -m unittest discover -s candidate/.github/scripts -p test_shared_newcomer.py
      - name: Build isolated production libraries and identical candidate harnesses
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          mkdir -p evidence
          git -C baseline rev-parse HEAD > evidence/base.txt
          git -C candidate rev-parse HEAD > evidence/head.txt
          printf '%s\n' '${{ github.sha }}' > evidence/workflow.txt
          dotnet --info > evidence/runtime.txt
          for variant in baseline candidate; do
            dotnet build "$variant/LiteDB/LiteDB.csproj" -c Release -f '${{ matrix.framework }}' '-p:TargetFrameworks=${{ matrix.framework }}' -p:TestingEnabled=false
            library="$GITHUB_WORKSPACE/$variant/LiteDB/bin/Release/${{ matrix.framework }}/LiteDB.dll"
            dotnet build candidate/tools/SharedWriterTenureMeasurements -c Release -f '${{ matrix.framework }}' "-p:LiteDBAssembly=$library" -p:TestingEnabled=false -o "runner-$variant"
            sha256sum "runner-$variant/SharedWriterTenureMeasurements.dll" "runner-$variant/LiteDB.dll" > "evidence/$variant-binaries.txt"
          done
      - name: Five paired fresh-attachment p50 and p99 rounds with positive checkpoint settings
        env:
          DOTNET_TieredCompilation: '0'
        shell: bash
        run: |
          set -euo pipefail
          timeout 15m python3 candidate/tools/SharedWriterTenureMeasurements/newcomer.py runner-baseline runner-candidate scratch evidence | tee evidence/report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mapped-newcomer-${{ matrix.framework }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
