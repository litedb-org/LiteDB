name: Phase 1 RNG validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index-safety:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        framework: [net8.0, net10.0]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Focused index RNG safety tests
        run: >-
          dotnet test LiteDB.Tests -c Release -f ${{ matrix.framework }}
          -p:TestingEnabled=true --settings tests.runsettings
          --filter FullyQualifiedName~IndexRandomizer_Tests
          --logger "trx;LogFileName=rng.trx" --results-directory artifacts/rng
      - name: Build existing index fuzz
        run: dotnet build LiteDB.Fuzz -c Release -f ${{ matrix.framework }} -p:TestingEnabled=true
      - name: Bounded existing index fuzz
        run: >-
          dotnet run --project LiteDB.Fuzz -c Release -f ${{ matrix.framework }} --no-build --
          --target index --seed 2947 --count 100 --artifact-dir artifacts/fuzz-index
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rng-safety-${{ matrix.os }}-${{ matrix.framework }}
          path: artifacts/
