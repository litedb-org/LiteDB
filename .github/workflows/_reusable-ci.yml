name: Reusable CI (Build & Test)

on:
  workflow_call:
    inputs:
      tier:
        description: CI coverage tier (pr or full)
        required: false
        type: string
        default: full
      sdk-matrix:
        description: Modern .NET SDK and target-framework combinations
        required: false
        type: string
        default: |
          [
            { "display": ".NET 8", "sdk": "8.0.x", "framework": "net8.0" },
            { "display": ".NET 10", "sdk": "10.0.x", "framework": "net10.0" }
          ]

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Check changed C# file sizes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check-csharp-size.py --base "${BASE_SHA:-HEAD^}"

      - name: Restore
        run: dotnet restore LiteDB.sln

      - name: Build
        run: dotnet build LiteDB.sln --configuration Release --no-restore /p:TestingEnabled=true

      - name: Verify vector file compatibility with LiteDB 5.0.21
        run: python3 scripts/test-vector-compatibility.py

      - name: Build memory validation runner
        run: dotnet build tools/MemoryValidation/MemoryValidation.csproj --configuration Release

      - name: Build memory profile measurements
        run: dotnet build tools/MemoryProfiles/MemoryProfiles.csproj --configuration Release

      - name: Package build outputs
        run: tar -czf tests-build-linux.tar.gz LiteDB/bin/Release LiteDB/obj/Release LiteDB.Tests/bin/Release LiteDB.Tests/obj/Release

      - name: Upload Linux test build
        uses: actions/upload-artifact@v4
        with:
          name: tests-build-linux
          path: tests-build-linux.tar.gz

  test-linux:
    name: Test (Linux ${{ matrix.item.display }})
    runs-on: ubuntu-latest
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJson(inputs.sdk-matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK ${{ matrix.item.display }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.item.sdk }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: tests-build-linux

      - name: Extract build artifacts
        run: tar -xzf tests-build-linux.tar.gz

      - name: Build test project for target framework
        run: >-
          dotnet build LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --framework ${{ matrix.item.framework }}
          --no-dependencies

      - name: Run tests
        timeout-minutes: 5
        run: >-
          dotnet test LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --no-build
          --framework ${{ matrix.item.framework }}
          --verbosity minimal
          --settings tests.runsettings
          --logger "trx;LogFileName=TestResults.trx"

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Restore
        run: dotnet restore LiteDB.sln

      - name: Build
        run: dotnet build LiteDB.sln --configuration Release --no-restore /p:TestingEnabled=true

      - name: Upload Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: tests-build-windows
          path: |
            LiteDB/bin/Release
            LiteDB/obj/Release
            LiteDB.Tests/bin/Release
            LiteDB.Tests/obj/Release

  test-windows:
    name: Test (Windows .NET 10)
    runs-on: windows-latest
    needs: build-windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: tests-build-windows
          path: .

      - name: Build test project
        run: >-
          dotnet build LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --framework net10.0
          --no-dependencies

      - name: Run tests, including cross-process shared mode
        timeout-minutes: 5
        run: >-
          dotnet test LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --no-build
          --framework net10.0
          --verbosity minimal
          --settings tests.runsettings
          --logger "trx;LogFileName=TestResults.trx"

  test-windows-net481:
    name: Test (Windows net481)
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      XUNIT_RUNNER_VERSION: 2.9.2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LiteDB.Tests/LiteDB.Tests.csproj

      - name: Build test project
        run: >-
          dotnet build LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --framework net481
          --no-restore
          /p:TestingEnabled=true

      - name: Run .NET Framework tests
        shell: pwsh
        run: |
          $runner = Join-Path $env:USERPROFILE ".nuget\packages\xunit.runner.console\$env:XUNIT_RUNNER_VERSION\tools\net481\xunit.console.exe"
          $assembly = "LiteDB.Tests\bin\Release\net481\LiteDB.Tests.dll"
          $results = "LiteDB.Tests\TestResults\TestResults-net481.xml"
          New-Item -ItemType Directory -Force (Split-Path $results) | Out-Null

          & $runner $assembly -nologo -xml $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          [xml]$report = Get-Content $results
          $total = [int]$report.assemblies.assembly.total
          if ($total -eq 0) { throw "The net481 runner discovered zero tests." }

  build-macos:
    name: Build (macOS, full tier)
    if: inputs.tier == 'full'
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Restore
        run: dotnet restore LiteDB.sln

      - name: Build
        run: dotnet build LiteDB.sln --configuration Release --no-restore /p:TestingEnabled=true

      - name: Package build outputs
        run: tar -czf tests-build-macos.tar.gz LiteDB/bin/Release LiteDB/obj/Release LiteDB.Tests/bin/Release LiteDB.Tests/obj/Release

      - name: Upload macOS test build
        uses: actions/upload-artifact@v4
        with:
          name: tests-build-macos
          path: tests-build-macos.tar.gz

  test-macos:
    name: Test (macOS ${{ matrix.item.display }}, full tier)
    if: inputs.tier == 'full'
    runs-on: macos-latest
    needs: build-macos
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJson(inputs.sdk-matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK ${{ matrix.item.display }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.item.sdk }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: tests-build-macos

      - name: Extract build artifacts
        run: tar -xzf tests-build-macos.tar.gz

      - name: Build test project for target framework
        run: >-
          dotnet build LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --framework ${{ matrix.item.framework }}
          --no-dependencies

      - name: Run tests
        timeout-minutes: 5
        run: >-
          dotnet test LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --no-build
          --framework ${{ matrix.item.framework }}
          --verbosity minimal
          --settings tests.runsettings
          --logger "trx;LogFileName=TestResults.trx"

  test-windows-secondary:
    name: Test (Windows 2022 ${{ matrix.item.display }}, full tier)
    if: inputs.tier == 'full'
    runs-on: windows-2022
    needs: build-windows
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJson(inputs.sdk-matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK ${{ matrix.item.display }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.item.sdk }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: tests-build-windows
          path: .

      - name: Build test project
        run: >-
          dotnet build LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --framework ${{ matrix.item.framework }}
          --no-dependencies

      - name: Run tests
        timeout-minutes: 5
        run: >-
          dotnet test LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --no-build
          --framework ${{ matrix.item.framework }}
          --verbosity minimal
          --settings tests.runsettings
          --logger "trx;LogFileName=TestResults.trx"

  test-windows-net462:
    name: Test (Windows net462, full tier)
    if: inputs.tier == 'full'
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      XUNIT_RUNNER_VERSION: 2.9.2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LiteDB.Tests/LiteDB.Tests.csproj

      - name: Build test project
        run: >-
          dotnet build LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --framework net462
          --no-restore
          /p:TestingEnabled=true

      - name: Run .NET Framework tests
        shell: pwsh
        run: |
          $runner = Join-Path $env:USERPROFILE ".nuget\packages\xunit.runner.console\$env:XUNIT_RUNNER_VERSION\tools\net462\xunit.console.exe"
          $assembly = "LiteDB.Tests\bin\Release\net462\LiteDB.Tests.dll"
          $results = "LiteDB.Tests\TestResults\TestResults-net462.xml"
          New-Item -ItemType Directory -Force (Split-Path $results) | Out-Null

          & $runner $assembly -nologo -xml $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          [xml]$report = Get-Content $results
          $total = [int]$report.assemblies.assembly.total
          if ($total -eq 0) { throw "The net462 runner discovered zero tests." }

  test-windows-x86:
    name: Test (Windows x86 .NET 10, full tier)
    if: inputs.tier == 'full'
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test with the x86 test host
        run: >-
          dotnet test LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --framework net10.0
          --arch x86
          --verbosity minimal
          --settings tests.runsettings
          --logger "trx;LogFileName=TestResults-x86.trx"
          /p:TestingEnabled=true

  test-linux-arm64:
    name: Test (Linux ARM64 .NET 10, full tier)
    if: inputs.tier == 'full'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify native ARM64 runner
        run: test "$(uname -m)" = "aarch64"

      - name: Run tests
        run: >-
          dotnet test LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --framework net10.0
          --verbosity minimal
          --settings tests.runsettings
          --logger "trx;LogFileName=TestResults-arm64.trx"
          /p:TestingEnabled=true
