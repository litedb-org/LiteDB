name: Reusable CI (Build & Test)

on:
  workflow_call:
    inputs:
      sdk-matrix:
        required: false
        type: string
        default: |
          [
            { "display": ".NET 8",  "sdk": "8.0.x",           "framework": "net8.0", "includePrerelease": false, "msbuildProps": "" },
            { "display": ".NET 9",  "sdk": "9.0.x\n8.0.x",    "framework": "net8.0", "includePrerelease": true,  "msbuildProps": "" },
            { "display": ".NET 10", "sdk": "10.0.x",          "framework": "net10.0", "includePrerelease": false, "msbuildProps": "" }
          ]

permissions:
  contents: read

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Check changed C# file sizes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check-csharp-size.py --base "${BASE_SHA:-HEAD^}"

      - name: Check Native AOT retry failure handling
        run: python3 scripts/test-aot-test-suite-gate.py

      - name: Restore
        run: dotnet restore LiteDB.sln

      - name: Build
        run: dotnet build LiteDB.sln --configuration Release --no-restore /p:TestingEnabled=true

      - name: Verify vector file compatibility with LiteDB 5.0.21
        run: python3 scripts/test-vector-compatibility.py

      - name: Build memory validation runner
        run: dotnet build tools/MemoryValidation/MemoryValidation.csproj --configuration Release

      - name: Build memory profile measurements
        run: dotnet build tools/MemoryProfiles/MemoryProfiles.csproj --configuration Release

      - name: Package build outputs
        run: tar -czf tests-build-linux.tar.gz LiteDB/bin/Release LiteDB/obj/Release LiteDB.Tests/bin/Release LiteDB.Tests/obj/Release

      - name: Upload linux test build
        uses: actions/upload-artifact@v4
        with:
          name: tests-build-linux
          path: tests-build-linux.tar.gz

      - name: Dry-run release package versions without publishing
        run: |
          dotnet tool restore
          VERSION_JSON=$(dotnet tool run dotnet-gitversion /output json)
          PACKAGE_VERSION=$(echo "$VERSION_JSON" | jq -er '.SemVer')
          ASSEMBLY_VERSION=$(echo "$VERSION_JSON" | jq -er '.AssemblySemVer')
          dotnet pack LiteDB/LiteDB.csproj --configuration Release -o artifacts/release-package-validation -p:TestingEnabled=false -p:UseFullSemVerForNuGet=false -p:PackageVersion="$PACKAGE_VERSION"
          dotnet pack LiteDB.SourceGenerator/LiteDB.SourceGenerator.csproj --configuration Release -o artifacts/release-package-validation -p:UseFullSemVerForNuGet=false -p:PackageVersion="$PACKAGE_VERSION"
          ./scripts/validate-source-generator-package-archive.sh artifacts/release-package-validation "$PACKAGE_VERSION"
          pwsh -NoProfile -File scripts/validate-package-assembly-versions.ps1 -PackageDirectory artifacts/release-package-validation -PackageVersion "$PACKAGE_VERSION" -AssemblyVersion "$ASSEMBLY_VERSION"

  test-linux:
    name: Test (Linux ${{ matrix.item.display }})
    runs-on: ubuntu-latest
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJson(inputs.sdk-matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK ${{ matrix.item.display }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.item.sdk }}
          include-prerelease: ${{ matrix.item.includePrerelease }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: tests-build-linux

      - name: Extract build artifacts
        run: tar -xzf tests-build-linux.tar.gz

      - name: Build test project for target framework
        run: >-
          dotnet build LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --framework ${{ matrix.item.framework }}
          --no-dependencies
          ${{ matrix.item.msbuildProps }}

      - name: Run tests
        timeout-minutes: 5
        run: >-
          dotnet test LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --no-build
          --framework ${{ matrix.item.framework }}
          --verbosity normal
          --settings tests.runsettings
          --logger "trx;LogFileName=TestResults.trx"
          --logger "console;verbosity=detailed"
          ${{ matrix.item.msbuildProps }}

  aot-smoke-linux:
    name: Native AOT smoke (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev libicu-dev

      - name: Run managed AOT mapping and generator tests
        run: >-
          dotnet test LiteDB.AotTests/LiteDB.AotTests.csproj
          --configuration Release
          --settings tests.runsettings

      - name: Validate packaged source-generator consumer
        run: ./scripts/validate-source-generator-package-consumer.sh

      - name: Compare regular, trimmed, and Native AOT feature coverage
        run: ./scripts/validate-aot-feature-parity.sh

  # The Linux job above covers net8.0 on linux-x64. Native AOT links against platform libraries and LiteDB has
  # platform-specific code (shared-mode mutexes, file locking, crypto back ends), so the same gate also has to
  # pass on the other operating systems and on every runtime LiteDB targets.
  aot-parity:
    name: Native AOT parity (${{ matrix.os }}, ${{ matrix.tfm }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        tfm: [net8.0, net10.0]
        exclude:
          - os: ubuntu-latest
            tfm: net8.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev libicu-dev

      - name: Compare regular, trimmed, and Native AOT feature coverage
        shell: bash
        env:
          TARGET_FRAMEWORK: ${{ matrix.tfm }}
        run: ./scripts/validate-aot-feature-parity.sh

      - name: Run the LiteDB test suite as a Native AOT binary
        shell: bash
        env:
          TARGET_FRAMEWORK: ${{ matrix.tfm }}
        run: ./scripts/validate-aot-test-suite.sh

  # musl is a separate runtime identifier with its own native toolchain and libc, and Alpine is the usual base
  # image for small Native AOT containers.
  aot-parity-alpine:
    name: Native AOT parity (alpine, ${{ matrix.tfm }})
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0-alpine
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        tfm: [net8.0, net10.0]

    steps:
      - name: Install Native AOT prerequisites
        run: apk add --no-cache bash clang build-base zlib-dev icu-libs icu-data-full

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compare regular, trimmed, and Native AOT feature coverage
        shell: bash
        env:
          TARGET_FRAMEWORK: ${{ matrix.tfm }}
        run: ./scripts/validate-aot-feature-parity.sh

      - name: Run the LiteDB test suite as a Native AOT binary
        shell: bash
        env:
          TARGET_FRAMEWORK: ${{ matrix.tfm }}
        run: ./scripts/validate-aot-test-suite.sh

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Restore
        run: dotnet restore LiteDB.sln

      - name: Build
        run: dotnet build LiteDB.sln --configuration Release --no-restore /p:TestingEnabled=true

      - name: Package build outputs
        run: tar -czf tests-build-macos.tar.gz LiteDB/bin/Release LiteDB/obj/Release LiteDB.Tests/bin/Release LiteDB.Tests/obj/Release

      - name: Upload macOS test build
        uses: actions/upload-artifact@v4
        with:
          name: tests-build-macos
          path: tests-build-macos.tar.gz

  test-macos:
    name: Test (macOS ${{ matrix.item.display }})
    runs-on: macos-latest
    needs: build-macos
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJson(inputs.sdk-matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK ${{ matrix.item.display }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.item.sdk }}
          include-prerelease: ${{ matrix.item.includePrerelease }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: tests-build-macos

      - name: Extract build artifacts
        run: tar -xzf tests-build-macos.tar.gz

      - name: Build test project for target framework
        run: >-
          dotnet build LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --framework ${{ matrix.item.framework }}
          --no-dependencies
          ${{ matrix.item.msbuildProps }}

      - name: Run tests
        timeout-minutes: 5
        run: >-
          dotnet test LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --no-build
          --framework ${{ matrix.item.framework }}
          --verbosity normal
          --settings tests.runsettings
          --logger "trx;LogFileName=TestResults.trx"
          --logger "console;verbosity=detailed"
          ${{ matrix.item.msbuildProps }}

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Restore
        run: dotnet restore LiteDB.sln

      - name: Build
        run: dotnet build LiteDB.sln --configuration Release --no-restore /p:TestingEnabled=true

      - name: Upload windows test build
        uses: actions/upload-artifact@v4
        with:
          name: tests-build-windows
          path: |
            LiteDB/bin/Release
            LiteDB/obj/Release
            LiteDB.Tests/bin/Release
            LiteDB.Tests/obj/Release

  test-windows:
    name: Test (Windows ${{ matrix.os }} - ${{ matrix.arch }} - ${{ matrix.item.display }})
    runs-on: ${{ matrix.os }}
    needs: build-windows
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
        arch: [x64, x86]
        item: ${{ fromJson(inputs.sdk-matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK ${{ matrix.item.display }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.item.sdk }}
          include-prerelease: ${{ matrix.item.includePrerelease }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: tests-build-windows
          path: .

      - name: Build test project for target framework (${{ matrix.arch }})
        run: >-
          dotnet build LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --framework ${{ matrix.item.framework }}
          --no-dependencies
          ${{ matrix.item.msbuildProps }}

      - name: Run tests (${{ matrix.arch }})
        timeout-minutes: 5
        run: >-
          dotnet test LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --no-build
          --framework ${{ matrix.item.framework }}
          --verbosity normal
          --settings tests.runsettings
          --logger "trx;LogFileName=TestResults-${{ matrix.arch }}.trx"
          --logger "console;verbosity=detailed"
          ${{ matrix.item.msbuildProps }}

  test-windows-framework:
    name: Test (Windows ${{ matrix.framework }})
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        framework: [net462, net481]
    env:
      XUNIT_RUNNER_VERSION: 2.9.2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Restore
        run: dotnet restore LiteDB.Tests/LiteDB.Tests.csproj

      - name: Build test project
        run: >-
          dotnet build LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --framework ${{ matrix.framework }}
          --no-restore
          /p:TestingEnabled=true

      - name: Run .NET Framework tests
        shell: pwsh
        run: |
          $framework = '${{ matrix.framework }}'
          $runner = Join-Path $env:USERPROFILE ".nuget\packages\xunit.runner.console\$env:XUNIT_RUNNER_VERSION\tools\$framework\xunit.console.exe"
          $assembly = "LiteDB.Tests\bin\Release\$framework\LiteDB.Tests.dll"
          $results = "LiteDB.Tests\TestResults\TestResults-$framework.xml"
          New-Item -ItemType Directory -Force (Split-Path $results) | Out-Null

          & $runner $assembly -nologo -xml $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          [xml]$report = Get-Content $results
          $total = [int]$report.assemblies.assembly.total
          if ($total -eq 0) { throw "The $framework runner discovered zero tests." }

  test-windows-crossprocess:
    name: Cross-Process Tests (Windows ${{ matrix.os }} - ${{ matrix.arch }} - ${{ matrix.item.display }})
    runs-on: ${{ matrix.os }}
    needs: build-windows
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
        arch: [x64, x86]
        item: ${{ fromJson(inputs.sdk-matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK ${{ matrix.item.display }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.item.sdk }}
          include-prerelease: ${{ matrix.item.includePrerelease }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: tests-build-windows
          path: .

      - name: Build test project for target framework (${{ matrix.arch }})
        run: >-
          dotnet build LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --framework ${{ matrix.item.framework }}
          --no-dependencies
          ${{ matrix.item.msbuildProps }}

      - name: Run cross-process shared mode tests (${{ matrix.arch }})
        timeout-minutes: 10
        run: >-
          dotnet test LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --no-build
          --framework ${{ matrix.item.framework }}
          --filter "FullyQualifiedName~CrossProcess_Shared_Tests"
          --verbosity normal
          --logger "trx;LogFileName=CrossProcessTestResults-${{ matrix.arch }}.trx"
          --logger "console;verbosity=detailed"
          ${{ matrix.item.msbuildProps }}

      - name: Upload cross-process test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossprocess-test-results-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.item.display }}
          path: LiteDB.Tests/TestResults/CrossProcessTestResults-${{ matrix.arch }}.trx

  test-linux-arm64:
    name: Test (Linux ARM64 - ${{ matrix.item.display }})
    runs-on: ubuntu-latest
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJson(inputs.sdk-matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up .NET SDK ${{ matrix.item.display }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.item.sdk }}
          include-prerelease: ${{ matrix.item.includePrerelease }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: tests-build-linux

      - name: Extract build artifacts
        run: tar -xzf tests-build-linux.tar.gz

      - name: Build test project for ARM64
        run: >-
          dotnet build LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --framework ${{ matrix.item.framework }}
          --no-dependencies
          ${{ matrix.item.msbuildProps }}

      - name: Run tests (ARM64 via QEMU)
        timeout-minutes: 10
        run: >-
          dotnet test LiteDB.Tests/LiteDB.Tests.csproj
          --configuration Release
          --no-build
          --framework ${{ matrix.item.framework }}
          --verbosity normal
          --logger "trx;LogFileName=TestResults-arm64.trx"
          --logger "console;verbosity=detailed"
          ${{ matrix.item.msbuildProps }}
