name: Repro Runner

on:
  workflow_dispatch:
    inputs:
      filter:
        description: Optional regular expression to select repros
        required: false
        type: string
      ref:
        description: Git ref (branch, tag, or SHA) to check out
        required: false
        type: string
  workflow_call:
    inputs:
      filter:
        required: false
        type: string
      ref:
        required: false
        type: string
      evidence_definition_sha:
        required: false
        type: string
      issue_2794_harness_overlay:
        required: false
        type: boolean
        default: false

jobs:
  generate-matrix:
    name: Generate matrix
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.compose.outputs.matrix }}
      count: ${{ steps.compose.outputs.count }}
      skipped: ${{ steps.compose.outputs.skipped }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref && inputs.ref || github.ref }}

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore ReproRunner CLI
        run: dotnet restore LiteDB.ReproRunner/LiteDB.ReproRunner.Cli/LiteDB.ReproRunner.Cli.csproj

      - name: Build ReproRunner CLI
        run: dotnet build LiteDB.ReproRunner/LiteDB.ReproRunner.Cli/LiteDB.ReproRunner.Cli.csproj --configuration Release --no-restore

      - name: Capture repro inventory
        id: list
        shell: bash
        run: |
          set -euo pipefail
          filter_input="${{ inputs.filter }}"
          cmd=(dotnet run --project LiteDB.ReproRunner/LiteDB.ReproRunner.Cli --configuration Release --no-build --no-restore -- list --json)
          if [ -n "${filter_input}" ]; then
            cmd+=("--filter" "${filter_input}")
          fi
          "${cmd[@]}" > repros.json

      - name: Compose matrix
        id: compose
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/compose_repro_matrix.py

      - name: Upload repro inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repros-json
          path: repros.json

  repro:
    name: Run ${{ matrix.repro }} on ${{ matrix.os }}
    needs: generate-matrix
    if: ${{ needs.generate-matrix.outputs.count != '0' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref && inputs.ref || github.ref }}

      - name: 'Check out trusted #2794 harness overlay'
        if: matrix.repro == 'Issue_2794_SharedJobHandoff' && inputs.issue_2794_harness_overlay
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.evidence_definition_sha }}
          path: .bugfix-evidence-definition
          persist-credentials: false
          sparse-checkout: |
            .github/bugfix/issue-2794-harness-overlay.json
            .github/bugfix/issue-2794-worker-overlay.cs
            .github/scripts/apply_issue_2794_harness_overlay.py
          sparse-checkout-cone-mode: false

      - name: 'Apply trusted #2794 harness overlay'
        if: matrix.repro == 'Issue_2794_SharedJobHandoff' && inputs.issue_2794_harness_overlay
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.ref }}
          EVIDENCE_DEFINITION_SHA: ${{ inputs.evidence_definition_sha }}
          TARGET_OS: ${{ matrix.os }}
        run: |
          python .bugfix-evidence-definition/.github/scripts/apply_issue_2794_harness_overlay.py \
            --source-root . \
            --definition-root .bugfix-evidence-definition \
            --source-sha "${SOURCE_SHA}" \
            --definition-sha "${EVIDENCE_DEFINITION_SHA}" \
            --target-os "${TARGET_OS}" \
            --output artifacts/harness-overlay-provenance.json

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore ReproRunner CLI
        run: dotnet restore LiteDB.ReproRunner/LiteDB.ReproRunner.Cli/LiteDB.ReproRunner.Cli.csproj

      - name: Build ReproRunner CLI
        run: dotnet build LiteDB.ReproRunner/LiteDB.ReproRunner.Cli/LiteDB.ReproRunner.Cli.csproj --configuration Release --no-restore

      - name: Execute repro
        id: run
        shell: bash
        env:
          LITEDB_CI_REPRO: ${{ matrix.repro }}
          LITEDB_CI_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          dotnet run --project LiteDB.ReproRunner/LiteDB.ReproRunner.Cli --configuration Release -- \
            run "${LITEDB_CI_REPRO}" --ci --target-os "${LITEDB_CI_OS}" \
            --report artifacts/repro-report.json --report-format json \
            2>&1 | tee artifacts/repro-console.log

      - name: Upload repro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.repro }}-${{ matrix.os }}
          path: |
            artifacts
          if-no-files-found: warn

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          status="${{ job.status }}"
          {
            echo "### ${{ matrix.repro }} (${{ matrix.os }})"
            echo "- Result: ${status}"
            echo "- Artifacts: logs-${{ matrix.repro }}-${{ matrix.os }}"
          } >> "${GITHUB_STEP_SUMMARY}"
