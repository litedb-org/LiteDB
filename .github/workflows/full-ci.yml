name: Full CI

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      handles_qualification:
        description: Add integrated handle stress, model seeds and full macOS Intel coverage
        type: boolean
        default: false
      macos_qualification:
        description: Run the complete mapped macOS qualification matrix only
        type: boolean
        default: false
      request_safety_diagnostic:
        description: Diagnose request safety only (never full qualification evidence)
        type: boolean
        default: false
      stress:
        description: Repeat tenure, wake, coherence and process-death coverage 50 times
        type: boolean
        default: false

jobs:
  ci-checks:
    if: ${{ !inputs.macos_qualification }}
    uses: ./.github/workflows/_reusable-ci.yml
    with:
      tier: full
    secrets: inherit

  reprorunner:
    if: ${{ !inputs.macos_qualification }}
    uses: ./.github/workflows/reprorunner.yml
    with:
      tier: full
    secrets: inherit

  notify-ci-failure:
    name: Report scheduled full CI failure
    if: ${{ github.event_name == 'schedule' && always() && (needs.ci-checks.result == 'failure' || needs.reprorunner.result == 'failure') }}
    needs: [ci-checks, reprorunner]
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Create or update failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'CI: scheduled full matrix is failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            const body = `Scheduled full CI failed for ${context.sha}. [View the workflow run](${runUrl}).`;
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }

  macos-qualification:
    if: inputs.macos_qualification
    name: Mapped macOS (${{ matrix.runner }} ${{ matrix.framework }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build test hooks and child harness
        run: dotnet build LiteDB.Tests/LiteDB.Tests.csproj -c Release -f ${{ matrix.framework }} -p:TestingEnabled=true -p:GitVersionEnabled=false
      - name: Run every mapped class and require complete TRX
        shell: pwsh
        env:
          LITEDB_EXPECTED_RUNTIME_MAJOR: ${{ matrix.framework == 'net8.0' && '8' || '10' }}
          LITEDB_EXPECTED_ARCHITECTURE: ${{ matrix.runner == 'macos-15' && 'arm64' || 'x64' }}
          QUALIFICATION_STRESS: ${{ inputs.stress }}
          REQUEST_SAFETY_DIAGNOSTIC: ${{ inputs.request_safety_diagnostic }}
        run: ./scripts/qualify-macos.ps1 -Framework '${{ matrix.framework }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-qualification-${{ matrix.runner }}-${{ matrix.framework }}
          path: artifacts_temp/macos-qualification/

  request-expiry-proof:
    if: inputs.macos_qualification
    name: Expired request real-revision proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Require the registered old revision to fail and this head to pass
        shell: pwsh
        env:
          LITEDB_EXPECTED_RUNTIME_MAJOR: '8'
          LITEDB_EXPECTED_ARCHITECTURE: x64
        run: ./scripts/verify-shared-request-expiry.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: request-expiry-real-revision-proof
          path: artifacts_temp/request-expiry-proof/

  handle-stress:
    if: inputs.handles_qualification
    name: Handle stress (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build LiteDB.Tests/LiteDB.Tests.csproj -c Release -f net8.0 -p:TestingEnabled=true -p:GitVersionEnabled=false
      - name: Fifty complete handle wait lifetime and process passes
        shell: pwsh
        env:
          LITEDB_EXPECTED_RUNTIME_MAJOR: '8'
          LITEDB_EXPECTED_ARCHITECTURE: ${{ (matrix.os == 'ubuntu-24.04-arm' || matrix.os == 'macos-15') && 'arm64' || 'x64' }}
        run: ./scripts/qualify-handles.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-stress-${{ matrix.os }}
          path: artifacts_temp/handle-qualification/
  intel-full:
    if: inputs.handles_qualification
    name: Full macOS Intel (${{ matrix.runtime }})
    runs-on: macos-15-intel
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runtime: [8, 9, 10]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Build exact candidate
        shell: pwsh
        run: |
          $framework = if (${{ matrix.runtime }} -eq 10) { 'net10.0' } else { 'net8.0' }
          dotnet build LiteDB.Tests/LiteDB.Tests.csproj -c Release -f $framework -p:TestingEnabled=true -p:GitVersionEnabled=false
          if ($LASTEXITCODE) { throw 'Build failed' }
          @{ sha = (git rev-parse HEAD); framework = $framework; sdk = (dotnet --version);
             librarySha256 = (Get-FileHash "LiteDB/bin/Release/$framework/LiteDB.dll" -Algorithm SHA256).Hash } |
            ConvertTo-Json | Set-Content LiteDB.Tests/bin/Release/build-evidence.json
      - name: Full suite with runtime and architecture guards
        shell: pwsh
        run: |
          $framework = if (${{ matrix.runtime }} -eq 10) { 'net10.0' } else { 'net8.0' }
          ./scripts/run-ci-tests.ps1 -RuntimeMajor ${{ matrix.runtime }} -Framework $framework -Architecture x64 -PartitionSuite
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-intel-full-${{ matrix.runtime }}
          path: |
            LiteDB.Tests/TestResults/
            LiteDB.Tests/bin/Release/
            LiteDB.Tests.SharedMutexHarness/bin/Release/
            LiteDB/bin/Release/
  handle-fuzz:
    if: inputs.handles_qualification
    name: Handle model seeds (${{ matrix.seed }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seed: [2946, 2947, 2948, 2949, 2950, 2951]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet run --project LiteDB.Fuzz -c Release -f net8.0 -p:TestingEnabled=true -- --target transaction-handle --seed ${{ matrix.seed }} --count 300 --artifact-dir artifacts/fuzz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-handle-model-${{ matrix.seed }}
          path: artifacts/fuzz/
