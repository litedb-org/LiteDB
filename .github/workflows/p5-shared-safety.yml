name: Shared open safety
on:
  workflow_dispatch:
  push:
    branches: [v6/wip-p5-shared-open]
    paths: [.github/workflows/p5-shared-safety.yml]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts_temp/shared-safety | Out-Null
          git rev-parse HEAD > artifacts_temp/shared-safety/head.txt
          $filter = 'FullyQualifiedName~SharedOneFile|FullyQualifiedName~SharedOfflineUpgrade|FullyQualifiedName~DatabaseAdmission|FullyQualifiedName~SharedCoordinationPolicy|FullyQualifiedName~DirectHostAdmission'
          dotnet build LiteDB.Tests -c Release -f net8.0 -p:TargetFrameworks=net8.0 -p:TestingEnabled=true -p:GitVersionEnabled=false
          if ($LASTEXITCODE) { throw 'Build failed' }
          $discovery = dotnet test LiteDB.Tests -c Release -f net8.0 -p:TargetFrameworks=net8.0 -p:TestingEnabled=true -p:GitVersionEnabled=false --no-build --no-restore --list-tests --filter $filter
          if ($LASTEXITCODE) { throw 'Discovery failed' }
          $discovery | Out-File artifacts_temp/shared-safety/discovery.txt
          $classes = @($discovery | ForEach-Object { if ($_ -match '^\s+(LiteDB\.[\w.]+_Tests)\.') { $Matches[1] } } | Sort-Object -Unique)
          if ($classes.Count -lt 50) { throw "Incomplete class discovery: $($classes.Count)" }
          $classes | Out-File artifacts_temp/shared-safety/classes.txt
          $failed = $false
          foreach ($testClass in $classes) {
            # Each discovered class gets the unchanged 300-second session budget.
            dotnet test LiteDB.Tests -c Release -f net8.0 -p:TargetFrameworks=net8.0 -p:TestingEnabled=true -p:GitVersionEnabled=false --no-build --no-restore --settings tests.runsettings --filter "FullyQualifiedName~$testClass." --logger "trx;LogFileName=$testClass.trx" --results-directory artifacts_temp/shared-safety
            if ($LASTEXITCODE) { $failed = $true }
          }
          if ($failed) { throw 'At least one Shared class failed or did not complete' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-safety-${{ matrix.os }}
          path: artifacts_temp/shared-safety/
          if-no-files-found: error
