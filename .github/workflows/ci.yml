name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Validates the queued candidate tree once a merge queue is enabled for dev
  # (a repository setting; see docs/rules/safety-evidence.md). Without a queue
  # GitHub never sends this event.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  # GitHub replaces a pending group member even when cancel-in-progress is false.
  # Unrelated label events must never enter the validation run's group.
  group: ci-${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && format('ignored-label-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.action != 'labeled' || github.event.label.name == 'full-ci' }}

jobs:
  build-and-test:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    uses: ./.github/workflows/_reusable-ci.yml
    with:
      tier: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') && 'full' || 'pr' }}

  repro-runner:
    if: contains(github.event.pull_request.labels.*.name, 'full-ci') && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    uses: ./.github/workflows/reprorunner.yml
    with:
      tier: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') && 'full' || 'pr' }}
    secrets: inherit

  rng-index-safety:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        framework: [net8.0, net10.0]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Focused index RNG safety tests
        run: >-
          dotnet test LiteDB.Tests -c Release -f ${{ matrix.framework }}
          -p:TestingEnabled=true --settings tests.runsettings
          --filter FullyQualifiedName~IndexRandomizer_Tests
          --logger "trx;LogFileName=rng.trx" --results-directory artifacts/rng
      - name: Build existing index fuzz
        run: dotnet build LiteDB.Fuzz -c Release -f ${{ matrix.framework }} -p:TestingEnabled=true
      - name: Bounded existing index fuzz
        run: >-
          dotnet run --project LiteDB.Fuzz -c Release -f ${{ matrix.framework }} --no-build --
          --target index --seed 2947 --count 100 --artifact-dir artifacts/fuzz-index
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rng-safety-${{ matrix.os }}-${{ matrix.framework }}
          path: artifacts/
