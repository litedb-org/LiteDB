name: CI

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze-shared-x86:
    name: Analyze retained Windows x86 shared-write dump
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          repository: litedb-org/LiteDB
          run-id: 35783032832
          github-token: ${{ github.token }}
          artifact-ids: 10719655935,10719188460,10718957169
          path: retained
      - name: Verify evidence and analyze managed threads
        shell: pwsh
        run: ./scripts/analyze-shared-x86.ps1
      - name: Analyze native threads using Windows debugging tools
        if: always()
        shell: pwsh
        run: ./scripts/analyze-shared-x86-native.ps1
      - name: Retain analysis output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-x86-dump-analysis
          path: analysis
          if-no-files-found: error
          retention-days: 14
