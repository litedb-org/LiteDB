name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-x86-diagnostic:
    name: Windows x86 shared-write progress validation (${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      LITEDB_SHARED_EXPECT_TEMP_VOLUME: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Preserve the original system-temp storage volume
        shell: pwsh
        run: |
          $diagnostics = Join-Path ([IO.Path]::GetTempPath()) 'litedb-shared-diagnostics-${{ github.run_id }}-${{ matrix.shard }}'
          if ([IO.Path]::GetPathRoot($diagnostics) -ne 'C:\') { throw "Original C-volume required: $diagnostics" }
          Write-Host "Original temp directory: $([IO.Path]::GetTempPath())"
          Write-Host "Database and diagnostics root: $diagnostics"
          "LITEDB_SHARED_DIAGNOSTICS=$diagnostics" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build exact test candidate
        shell: pwsh
        run: |
          git rev-parse HEAD
          $productionTree = git rev-parse HEAD:LiteDB
          if ($productionTree -ne '93694b6b60e26a4fb25a7b77ab5faa98132d7c7e') { throw "Production tree changed: $productionTree" }
          dotnet build LiteDB.Tests/LiteDB.Tests.csproj -c Release -f net8.0 -p:TestingEnabled=true
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
      - name: Install and verify Microsoft ProcDump
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'Procdump.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'litedb-procdump'
          Invoke-WebRequest 'https://download.sysinternals.com/files/Procdump.zip' -OutFile $archive
          Expand-Archive $archive $directory
          $executable = Join-Path $directory 'procdump.exe'
          $signature = Get-AuthenticodeSignature $executable
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "Untrusted ProcDump signature: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          Get-FileHash $archive, $executable -Algorithm SHA256 | Format-List
          (Get-Item $executable).VersionInfo | Format-List FileVersion, ProductVersion
          "LITEDB_SHARED_PROCDUMP=$executable" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install exact original x86 runtime
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'litedb-dotnet-install.ps1'
          $runtime = Join-Path $env:RUNNER_TEMP 'litedb-runtime-8-x86'
          Invoke-WebRequest 'https://dot.net/v1/dotnet-install.ps1' -OutFile $installer
          & $installer -Runtime dotnet -Version '8.0.31' -Architecture x86 -InstallDir $runtime -NoPath
          & (Join-Path $runtime 'dotnet.exe') --info
          if ($LASTEXITCODE -ne 0) { throw 'Runtime installation failed.' }
      - name: Verify runtime and diagnostic contracts
        shell: pwsh
        env:
          LITEDB_SHARED_DUMP_SMOKE: '1'
        run: |
          ./scripts/run-ci-tests.ps1 -RuntimeMajor 8 -Framework net8.0 -Architecture x86 `
            -RuntimeDirectory (Join-Path $env:RUNNER_TEMP 'litedb-runtime-8-x86') `
            -Filter 'FullyQualifiedName~CrossProcess_Shared_Tests|FullyQualifiedName~SharedWorkerDump|FullyQualifiedName~SharedWorkerWatchdog|FullyQualifiedName~SharedWriteOracle' `
            -ResultFile 'SharedDiagnosticContracts.trx'
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic contract tests failed.' }
      - name: Run fifty cold-host concurrent-write repetitions
        shell: pwsh
        timeout-minutes: 35
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'litedb-runtime-8-x86'
          for ($repeat = 1; $repeat -le 50; $repeat++) {
            Write-Host "Shard ${{ matrix.shard }}; cold-host repetition $repeat of 50"
            ./scripts/run-ci-tests.ps1 -RuntimeMajor 8 -Framework net8.0 -Architecture x86 `
              -RuntimeDirectory $runtime -Filter 'FullyQualifiedName~CrossProcess_Shared_ConcurrentWrites_InsertDocuments' `
              -ResultFile "SharedInsert-$repeat.trx"
            if ($LASTEXITCODE -ne 0) { throw "Concurrent insert repetition $repeat failed; preserving diagnostics." }
          }
      - name: Preserve results and any timeout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-progress-results-${{ matrix.shard }}
          path: LiteDB.Tests/TestResults/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve source-volume diagnostics after test-host exit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-progress-source-volume-${{ matrix.shard }}
          path: ${{ env.LITEDB_SHARED_DIAGNOSTICS }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve exact symbols and x86 runtime after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shared-progress-binaries-${{ matrix.shard }}
          path: |
            LiteDB.Tests/bin/Release/net8.0/
            ${{ runner.temp }}/litedb-runtime-8-x86/shared/Microsoft.NETCore.App/
          if-no-files-found: warn
          retention-days: 14
