name: Shared slot production comparisons

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Baseline branch or SHA for an isolated candidate comparison'
        required: false
        default: 'codex/shared-performance-followups'
        type: string
      suite:
        description: 'Production workload suite'
        required: false
        default: standard
        type: choice
        options: [standard, core, readers, contention]
      reader_interval_ms:
        description: 'Per-reader offered interval for reader comparisons (0 saturates)'
        required: false
        default: 0
        type: number
      reader_frameworks:
        description: 'Reader runtimes (JSON array)'
        default: '["net8.0", "net10.0"]'
        type: string
      reader_activities:
        description: 'Reader activities (JSON array)'
        default: '["idle", "writer", "checkpoint"]'
        type: string
      reader_scenarios:
        description: 'Space-separated reader scenarios'
        default: 'point medium large'
        type: string
      reader_counts:
        description: 'Space-separated reader process counts'
        default: '1 4'
        type: string
      profile_ownership:
        description: 'DIAGNOSTIC ONLY: instrument mutex wait, engine open and cache retirement'
        default: false
        type: boolean
  pull_request:
    paths:
      - 'LiteDB/Client/Shared/SharedReaderSlots.cs'
      # Wait primitives of the Shared writer handoff: the contended-acquire gate exists for them.
      - 'LiteDB/Client/Shared/SharedMutex*.cs'
      - 'LiteDB/Client/Shared/SharedEngine.Waiters.cs'
      - 'tools/SharedReadBenchmarks/**'
      - 'scripts/measure-shared-slots.py'
      - 'scripts/measure-shared-contention.py'
      - 'scripts/measure-shared-acquire.py'
      - '.github/scripts/compare_contention.py'
      - '.github/scripts/test_compare_contention.py'
      - 'scripts/measure-shared-readers.py'
      - 'scripts/verify-shared-slot-interop.py'
      - 'LiteDB.Fuzz/CheckpointedFileVerifier.cs'
      - 'LiteDB.Fuzz.Tests/CheckpointedFileVerifier_Tests.cs'
      - '.github/workflows/shared-slot-performance.yml'

permissions:
  contents: read

jobs:
  compare:
    if: inputs.suite != 'readers' && inputs.suite != 'contention'
    name: Compare (${{ matrix.os }}, ${{ matrix.framework }}, ${{ matrix.workload }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: [net8.0, net10.0]
        workload: ${{ fromJSON(inputs.suite == 'core' && '["core"]' || '["core", "traffic"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: ${{ github.event.pull_request.base.sha || inputs.baseline_ref || 'codex/shared-performance-followups' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build production libraries and identical runners
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseSha = git -C baseline rev-parse HEAD
          git -C candidate merge-base --is-ancestor $baseSha HEAD
          if ($LASTEXITCODE) { throw 'Merge the current PR base into the head before measuring it.' }
          foreach ($variant in @('baseline', 'candidate')) {
            # A release baseline can predate the current runtime TFMs; compile both
            # source trees for the runner's TFM so the production comparison is valid.
            dotnet build "$variant/LiteDB/LiteDB.csproj" -c Release -f '${{ matrix.framework }}' '-p:TargetFrameworks=${{ matrix.framework }}' -p:TestingEnabled=false
            if ($LASTEXITCODE) { throw "Library build failed: $variant" }
            $library = Join-Path $PWD "$variant/LiteDB/bin/Release/${{ matrix.framework }}/LiteDB.dll"
            dotnet build candidate/tools/SharedReadBenchmarks -c Release -f '${{ matrix.framework }}' "-p:LiteDBAssembly=$library" -o "runner-$variant"
            if ($LASTEXITCODE) { throw "Runner build failed: $variant" }
          }
          New-Item -ItemType Directory evidence | Out-Null
          git -C baseline rev-parse HEAD | Out-File evidence/base.txt
          git -C candidate rev-parse HEAD | Out-File evidence/head.txt
          dotnet --info | Out-File evidence/runtime.txt
      - name: Five serial alternating production pairs
        shell: pwsh
        run: |
          if ('${{ matrix.workload }}' -eq 'core') {
            python candidate/scripts/measure-shared-slots.py --baseline runner-baseline --candidate runner-candidate --scratch scratch --output evidence/paired.jsonl --matrix core --scenarios point scan mixed
          } else {
            python candidate/scripts/measure-shared-slots.py --baseline runner-baseline --candidate runner-candidate --scratch scratch --output evidence/paired.jsonl --matrix traffic
          }
          if ($LASTEXITCODE) { throw 'Production comparison failed' }
      - name: Candidate slot lifecycle and boundary diagnostics
        if: matrix.workload == 'core'
        shell: pwsh
        run: |
          python candidate/scripts/measure-shared-slots.py --baseline runner-baseline --candidate runner-candidate --scratch scratch --output evidence/candidate-slots.jsonl --matrix core --scenarios slots --candidate-only
          if ($LASTEXITCODE) { throw 'Candidate slot diagnostics failed' }
      - name: Two and four writer contention with lifecycle accounting
        if: matrix.workload == 'core'
        shell: pwsh
        run: |
          python candidate/scripts/measure-shared-contention.py --baseline runner-baseline --candidate runner-candidate --scratch scratch --output evidence/contention.jsonl
          if ($LASTEXITCODE) { throw 'Contention comparison failed' }
      - name: Two and four process contended writer acquisition
        if: matrix.workload == 'core'
        shell: pwsh
        run: |
          python candidate/scripts/measure-shared-acquire.py --baseline runner-baseline --candidate runner-candidate --scratch scratch --output evidence/acquire.jsonl
          if ($LASTEXITCODE) { throw 'Acquire comparison failed' }
      - name: Acquire latency and starvation within tolerance of base
        if: matrix.workload == 'core'
        shell: pwsh
        run: |
          python candidate/.github/scripts/compare_contention.py --results evidence/acquire.jsonl
          if ($LASTEXITCODE) { throw 'Contended acquisition regressed beyond tolerance' }
      - name: Same-version production state campaign with writer death and raw validation
        if: matrix.workload == 'core'
        timeout-minutes: 5
        shell: pwsh
        run: |
          dotnet build candidate/LiteDB.Fuzz -c Release -f net8.0 -p:TestingEnabled=true
          if ($LASTEXITCODE) { throw 'Raw verifier build failed' }
          python candidate/scripts/verify-shared-slot-interop.py --baseline runner-baseline --candidate runner-candidate --validator candidate/LiteDB.Fuzz/bin/Release/net8.0/LiteDB.Fuzz.dll --scratch evidence/interop | Tee-Object evidence/interop.jsonl
          if ($LASTEXITCODE) { throw 'Production state campaign failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-slots-${{ matrix.os }}-${{ matrix.framework }}-${{ matrix.workload }}
          path: evidence
          retention-days: 14

  readers:
    if: inputs.suite == 'readers'
    name: Readers (${{ matrix.os }}, ${{ matrix.framework }}, ${{ matrix.activity }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: ${{ fromJSON(inputs.reader_frameworks || '["net8.0", "net10.0"]') }}
        activity: ${{ fromJSON(inputs.reader_activities || '["idle", "writer", "checkpoint"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: ${{ github.event.pull_request.base.sha || inputs.baseline_ref || 'codex/shared-performance-followups' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build production libraries and identical runners
        shell: pwsh
        env:
          READER_FRAMEWORK: ${{ matrix.framework }}
          PROFILE_OWNERSHIP: ${{ inputs.profile_ownership }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:READER_FRAMEWORK -notin @('net8.0', 'net10.0')) { throw 'Unsupported reader framework' }
          $baseSha = git -C baseline rev-parse HEAD
          git -C candidate merge-base --is-ancestor $baseSha HEAD
          if ($LASTEXITCODE) { throw 'Merge the current PR base into the head before measuring it.' }
          if ($env:PROFILE_OWNERSHIP -eq 'true') {
            python candidate/scripts/instrument-shared-ownership.py baseline candidate --output ownership-profile.patch
            if ($LASTEXITCODE) { throw 'Ownership instrumentation failed' }
          }
          foreach ($variant in @('baseline', 'candidate')) {
            dotnet build "$variant/LiteDB/LiteDB.csproj" -c Release -f $env:READER_FRAMEWORK "-p:TargetFrameworks=$env:READER_FRAMEWORK" -p:TestingEnabled=false
            if ($LASTEXITCODE) { throw "Library build failed: $variant" }
            $library = Join-Path $PWD "$variant/LiteDB/bin/Release/$env:READER_FRAMEWORK/LiteDB.dll"
            dotnet build candidate/tools/SharedReadBenchmarks -c Release -f $env:READER_FRAMEWORK "-p:LiteDBAssembly=$library" -o "runner-$variant"
            if ($LASTEXITCODE) { throw "Runner build failed: $variant" }
          }
          New-Item -ItemType Directory evidence | Out-Null
          if (Test-Path ownership-profile.patch) { Copy-Item ownership-profile.patch evidence/ownership-profile.patch }
          git -C baseline rev-parse HEAD | Out-File evidence/base.txt
          git -C candidate rev-parse HEAD | Out-File evidence/head.txt
          dotnet --info | Out-File evidence/runtime.txt
      - name: Concurrent reader production pairs
        shell: pwsh
        env:
          READER_ACTIVITY: ${{ matrix.activity }}
          READER_SCENARIOS: ${{ inputs.reader_scenarios || 'point medium large' }}
          READER_COUNTS: ${{ inputs.reader_counts || '1 4' }}
          READER_INTERVAL: ${{ inputs.reader_interval_ms || 0 }}
        run: |
          $scenarios = $env:READER_SCENARIOS -split ' '
          $counts = $env:READER_COUNTS -split ' '
          python candidate/scripts/measure-shared-readers.py --baseline runner-baseline --candidate runner-candidate --scratch evidence/scratch --output evidence/readers.jsonl --activity $env:READER_ACTIVITY --reader-interval-ms $env:READER_INTERVAL --scenarios @scenarios --readers @counts
          if ($LASTEXITCODE) { throw 'Reader comparison failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-readers-${{ matrix.os }}-${{ matrix.framework }}-${{ matrix.activity }}
          path: evidence
          retention-days: 14

  contention:
    if: inputs.suite == 'contention'
    name: Pin lifecycle (${{ matrix.os }}, ${{ matrix.framework }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: ${{ github.event.pull_request.base.sha || inputs.baseline_ref || 'codex/shared-performance-followups' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build production libraries and identical runners
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseSha = git -C baseline rev-parse HEAD
          git -C candidate merge-base --is-ancestor $baseSha HEAD
          if ($LASTEXITCODE) { throw 'Merge the current PR base into the head before measuring it.' }
          foreach ($variant in @('baseline', 'candidate')) {
            dotnet build "$variant/LiteDB/LiteDB.csproj" -c Release -f '${{ matrix.framework }}' '-p:TargetFrameworks=${{ matrix.framework }}' -p:TestingEnabled=false
            if ($LASTEXITCODE) { throw "Library build failed: $variant" }
            $library = Join-Path $PWD "$variant/LiteDB/bin/Release/${{ matrix.framework }}/LiteDB.dll"
            dotnet build candidate/tools/SharedReadBenchmarks -c Release -f '${{ matrix.framework }}' "-p:LiteDBAssembly=$library" -o "runner-$variant"
            if ($LASTEXITCODE) { throw "Runner build failed: $variant" }
          }
          New-Item -ItemType Directory evidence | Out-Null
          git -C baseline rev-parse HEAD | Out-File evidence/base.txt
          git -C candidate rev-parse HEAD | Out-File evidence/head.txt
          dotnet --info | Out-File evidence/runtime.txt
      - name: Pin lifecycle and paired writer fairness
        shell: pwsh
        run: |
          foreach ($variant in @('baseline', 'candidate')) {
            dotnet "runner-$variant/SharedReadBenchmarks.dll" scratch shared holder 2000 | Out-File "evidence/holder-$variant.json"
            if ($LASTEXITCODE) { throw "Holder diagnostic failed: $variant" }
          }
          python candidate/scripts/measure-shared-contention.py --baseline runner-baseline --candidate runner-candidate --scratch evidence/scratch --output evidence/contention.jsonl
          if ($LASTEXITCODE) { throw 'Contention comparison failed' }
      - name: Contended writer acquisition within tolerance of base
        shell: pwsh
        run: |
          python candidate/scripts/measure-shared-acquire.py --baseline runner-baseline --candidate runner-candidate --scratch evidence/scratch --output evidence/acquire.jsonl
          if ($LASTEXITCODE) { throw 'Acquire comparison failed' }
          python candidate/.github/scripts/compare_contention.py --results evidence/acquire.jsonl
          if ($LASTEXITCODE) { throw 'Contended acquisition regressed beyond tolerance' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-pin-${{ matrix.os }}-${{ matrix.framework }}
          path: evidence
          retention-days: 14
