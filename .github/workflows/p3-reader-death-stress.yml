name: P3 reader death stress
on:
  workflow_dispatch:
  push:
    branches: ['v6/wip-f-p3-readerdeath']
permissions:
  contents: read
jobs:
  stress:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
        runtime: [8, 9, 10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Build selected framework and child harness
        run: dotnet build LiteDB.Tests/LiteDB.Tests.csproj -c Release -f ${{ matrix.runtime == 10 && 'net10.0' || 'net8.0' }} -p:TestingEnabled=true -p:GitVersionEnabled=false
      - name: Repeat both complete classes 100 times with native release timings
        run: python .github/scripts/p3_reader_death_stress.py --framework ${{ matrix.runtime == 10 && 'net10.0' || 'net8.0' }} --repeat 100 --runtime-major ${{ matrix.runtime }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-death-${{ matrix.runner }}-net${{ matrix.runtime }}
          path: artifacts_temp/reader-death
