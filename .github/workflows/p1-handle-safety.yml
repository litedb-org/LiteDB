name: P1 WAL handle safety
on:
  workflow_dispatch:
  push:
    branches: ['v6/p1-perf-group-handle']
permissions:
  contents: read
jobs:
  safety:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Group commit, faults, WAL, recovery and lifetime
        shell: pwsh
        run: |
          $all = 'FullyQualifiedName~GroupCommit|FullyQualifiedName~Wal|FullyQualifiedName~Recovery|FullyQualifiedName~NativeFileSync|FullyQualifiedName~Rebuild|FullyQualifiedName~Durable|FullyQualifiedName~LiteDB.Tests.Mapper'
          $core = 'FullyQualifiedName~GroupCommit|FullyQualifiedName~WalHandleLifetime|FullyQualifiedName~NativeFileSync'
          $other = 'FullyQualifiedName!~GroupCommit&FullyQualifiedName!~WalHandleLifetime&FullyQualifiedName!~NativeFileSync'
          $coordinated = 'FullyQualifiedName~SharedWriterTenureCoordinatedAdmission_Tests|FullyQualifiedName~SharedWriterTenureCoherenceBreadth_Tests|FullyQualifiedName~SharedOneFileWarmReads_Tests'
          $filters = @($coordinated, $core, "($all)&($other)&FullyQualifiedName~Wal", "($all)&($other)&FullyQualifiedName!~Wal")
          $failed = $false
          for ($i = 0; $i -lt $filters.Count; $i++) {
            dotnet test LiteDB.Tests/LiteDB.Tests.csproj -c Release -f ${{ matrix.framework }} -p:TestingEnabled=true -p:GitVersionEnabled=false --settings tests.runsettings --filter $filters[$i] --logger "trx;LogFileName=safety-$i.trx" --results-directory artifacts_temp/handle-safety
            if ($LASTEXITCODE) { $failed = $true }
          }
          if ($failed) { throw 'At least one safety partition failed or did not complete' }
      - name: Primary key range delete differential and fault recovery
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          dotnet test LiteDB.Tests/LiteDB.Tests.csproj -c Release -f ${{ matrix.framework }} -p:TestingEnabled=true -p:GitVersionEnabled=false --settings tests.runsettings --filter 'FullyQualifiedName~PrimaryKeyDelete|FullyQualifiedName~DeleteMany|FullyQualifiedName~Transactions_Tests|FullyQualifiedName~ReaderSnapshot' --logger 'trx;LogFileName=delete-safety.trx' --results-directory artifacts_temp/handle-safety
          if ($LASTEXITCODE) { throw 'Delete safety failed' }
      - name: Phase 4 ownership, legacy admission and retained Shared tenure
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $filters = @(
            'FullyQualifiedName~OwnershipLease_Tests|FullyQualifiedName~RuntimeLock_Tests|FullyQualifiedName~Issue2991|FullyQualifiedName~Issue2814Admission|FullyQualifiedName~Transactions_Tests|FullyQualifiedName~SameThread',
            'FullyQualifiedName~DirectProcessHost|FullyQualifiedName~DirectHostSafety|FullyQualifiedName~DirectHostAllocation|FullyQualifiedName~DirectHostGroupCommit',
            'FullyQualifiedName~SharedWriterTenure',
            'FullyQualifiedName~DocumentLookupCursor|FullyQualifiedName~MvccCursorModel|FullyQualifiedName~TransactionCleanup|FullyQualifiedName~TransactionCompletion|FullyQualifiedName~Issue1344SnapshotCursor|FullyQualifiedName~SharedRetryWriterRelease'
          )
          # Every SharedOneFile suite gets the unchanged 300-second session budget.
          # Aggregate mapped crash/recovery cases exceed that budget on Linux.
          $sharedSuites = Get-ChildItem LiteDB.Tests/Internals/SharedOneFile*_Tests.cs | ForEach-Object {
            [regex]::Matches((Get-Content $_.FullName -Raw), 'class\s+(SharedOneFile\w*_Tests)') | ForEach-Object { $_.Groups[1].Value }
          } | Sort-Object -Unique
          if (!$sharedSuites.Count) { throw 'No SharedOneFile safety suites discovered' }
          foreach ($suite in $sharedSuites) { $filters += "FullyQualifiedName~$suite." }
          $failed = @()
          for ($i = 0; $i -lt $filters.Count; $i++) {
            dotnet test LiteDB.Tests/LiteDB.Tests.csproj -c Release -f ${{ matrix.framework }} -p:TestingEnabled=true -p:GitVersionEnabled=false --settings tests.runsettings --filter $filters[$i] --logger "trx;LogFileName=ownership-$i.trx" --results-directory artifacts_temp/handle-safety
            if ($LASTEXITCODE) { $failed += $i }
          }
          if ($failed.Count) { throw "Ownership safety partitions failed: $failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handle-safety-${{ matrix.os }}-${{ matrix.framework }}
          path: artifacts_temp/handle-safety
