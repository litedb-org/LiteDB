name: P1 WAL handle safety
on:
  workflow_dispatch:
  push:
    branches: ['v6/p1-perf-group-handle']
permissions:
  contents: read
jobs:
  safety:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Group commit, faults, WAL, recovery and lifetime
        run: dotnet test LiteDB.Tests/LiteDB.Tests.csproj -c Release -f ${{ matrix.framework }} -p:TestingEnabled=true -p:GitVersionEnabled=false --settings tests.runsettings --filter "FullyQualifiedName~GroupCommit|FullyQualifiedName~Wal|FullyQualifiedName~Recovery|FullyQualifiedName~NativeFileSync|FullyQualifiedName~Rebuild|FullyQualifiedName~Durable" --logger "trx;LogFileName=safety.trx" --results-directory artifacts_temp/handle-safety
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handle-safety-${{ matrix.os }}-${{ matrix.framework }}
          path: artifacts_temp/handle-safety
