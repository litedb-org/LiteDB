name: P1 primary key delete safety
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Delete, cursors, transactions and WAL fault recovery
        shell: pwsh
        run: |
          dotnet test LiteDB.Tests/LiteDB.Tests.csproj -c Release -f ${{ matrix.framework }} -p:TestingEnabled=true -p:GitVersionEnabled=false --settings tests.runsettings --filter 'FullyQualifiedName~PrimaryKeyDelete|FullyQualifiedName~DeleteMany|FullyQualifiedName~Transactions_Tests|FullyQualifiedName~WalCombined|FullyQualifiedName~ReaderSnapshot' --logger 'trx;LogFileName=delete-safety.trx' --results-directory artifacts_temp/delete-safety
          if ($LASTEXITCODE) { throw 'Delete safety failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delete-safety-${{ matrix.os }}-${{ matrix.framework }}
          path: artifacts_temp/delete-safety
