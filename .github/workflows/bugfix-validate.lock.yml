name: "Wholesale bugfix validation worker"
on:
  # bots: # Bots processed as bot check in pre-activation job
  # - github-actions[bot] # Bots processed as bot check in pre-activation job
  push:
    branches:
    - automation/wholesale-bugfix
    paths:
    - .github/workflows/bugfix-validate.md
    - .github/workflows/bugfix-validate.lock.yml
  workflow_dispatch:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (used internally by Agentic Workflows)."
        required: false
        type: string
      base_sha:
        description: Integration base before the fix
        required: true
        type: string
      candidate_sha:
        description: Exact candidate commit to review
        required: true
        type: string
      issue:
        description: Eligible issue number
        required: true
        type: string
      request_id:
        default: ""
        description: Controller correlation ID
        required: false
        type: string
      role:
        description: Independent reviewer perspective
        options:
        - behavior
        - compatibility
        - lifecycle
        required: true
        type: choice
      source_run:
        default: ""
        description: Candidate check run
        required: false
        type: string
      test_source_sha:
        default: dd937719f7eee53c512f50ac604cab639bf42a4c
        description: Frozen regression revision
        required: true
        type: string

permissions: {}

concurrency:
  cancel-in-progress: false
  group: wholesale-bugfix-review-${{ inputs.issue }}-${{ inputs.role }}

run-name: Bugfix review ${{ inputs.request_id || 'registration' }}

jobs:
  activation:
    needs: pre_activation
    if: needs.pre_activation.outputs.activated == 'true' && (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
    env:
      GH_AW_MAX_DAILY_AI_CREDITS: ${{ vars.GH_AW_DEFAULT_MAX_DAILY_AI_CREDITS || '5000' }}
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      comment_id: ""
      comment_repo: ""
