name: Bugfix Full CI Build Probe
run-name: 'Bugfix full CI build probe for #${{ inputs.issue }} at ${{ inputs.source_sha }}'

on:
  push:
    branches:
      - automation/wholesale-bugfix
    paths:
      - .github/workflows/bugfix-full-ci-build-probe.yml
      - .github/workflows/_bugfix-full-ci-matrix.yml
  workflow_dispatch:
    inputs:
      issue:
        description: Issue execution contract to validate
        required: true
        type: string
      source_sha:
        description: Exact source commit to test
        required: true
        type: string
      evidence_definition_sha:
        description: Trusted commit containing this workflow
        required: true
        type: string
      quarantine_sha256:
        description: SHA-256 of the trusted explicit coverage-gap manifest
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/_bugfix-full-ci-matrix.yml
    with:
      issue: ${{ inputs.issue }}
      source-sha: ${{ inputs.source_sha }}
      evidence-definition-sha: ${{ inputs.evidence_definition_sha }}
      quarantine-sha256: ${{ inputs.quarantine_sha256 }}
