name: Shared admission known-bad proof
on:
  push:
    branches: ['v6/wip-f-p5-macos-eagain']
    paths: ['.github/workflows/shared-admission-before.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  before:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7000dd6f01d0187a8fb5d030064eb327864ab731
          path: product
      - uses: actions/checkout@v4
        with:
          ref: 4bb83431e754469ec394564a5ca85d9fd82a8554
          path: overlay
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install test-only overlay on exact known-bad product
        shell: python
        run: |
          from pathlib import Path
          for name in ('LiteDB.Tests/Internals/SharedRequestAdmission_Tests.cs', 'LiteDB.Tests.SharedMutexHarness/SharedRequestAdmissionHarness.cs'):
              Path('product', name).write_bytes(Path('overlay', name).read_bytes())
          # Old product has no explicit-budget overload. Keep the same two
          # baseline guards; the added overload timeout guard runs after fixing.
          test = Path('product/LiteDB.Tests/Internals/SharedRequestAdmission_Tests.cs')
          text = test.read_text()
          start = text.index('        [Fact]\n        public async Task Dms_timeout')
          end = text.index('        public void Dispose()', start)
          test.write_text(text[:start] + text[end:])
          path = Path('product/LiteDB.Tests.SharedMutexHarness/SharedOneFileHarness.cs')
          text = path.read_text()
          text = text.replace('        if (SharedOneFileProductionReuseHarness', '        if (SharedRequestAdmissionHarness.TryRun(mode, filename, args)) return true;\n        if (SharedOneFileProductionReuseHarness', 1)
          assert 'SharedRequestAdmissionHarness.TryRun' in text
          path.write_text(text)
      - name: Known-bad tests (expected failure retained as failure)
        working-directory: product
        shell: pwsh
        run: |
          git rev-parse HEAD
          dotnet test LiteDB.Tests/LiteDB.Tests.csproj -c Release -f net8.0 -p:TestingEnabled=true -p:GitVersionEnabled=false --settings tests.runsettings --filter FullyQualifiedName~SharedRequestAdmission_Tests --logger 'trx;LogFileName=before.trx' --results-directory artifacts_temp/admission-before
          if ($LASTEXITCODE) { throw 'Known-bad admission regression failed; inspect TRX' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admission-before-${{ matrix.os }}
          path: product/artifacts_temp/admission-before
