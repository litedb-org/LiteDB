name: Bugfix Full CI
run-name: 'Bugfix full CI for #${{ inputs.issue }} at ${{ inputs.source_sha }}'

on:
  push:
    branches:
      - automation/wholesale-bugfix
    paths:
      - .github/workflows/bugfix-full-ci.yml
      - .github/workflows/_bugfix-full-ci-matrix.yml
      - .github/workflows/reprorunner.yml
      - .github/bugfix/issue-2794-harness-overlay.json
      - .github/bugfix/issue-2794-worker-overlay.cs
      - .github/scripts/apply_issue_2794_harness_overlay.py
      - .github/bugfix/issue-2825-harness-overlay.json
      - .github/bugfix/issue-2825-classifier-overlay.cs
      - .github/scripts/apply_issue_2825_harness_overlay.py
  workflow_dispatch:
    inputs:
      issue:
        description: Issue execution contract to validate
        required: true
        type: string
      source_sha:
        description: Exact candidate or integration-base commit to test
        required: true
        type: string
      evidence_definition_sha:
        description: Trusted commit containing this workflow and evidence policy
        required: true
        type: string
      quarantine_sha256:
        description: SHA-256 of the trusted explicit coverage-gap manifest
        required: true
        type: string
      harness_overlay_manifest_sha256:
        description: SHA-256 of the trusted #2794 CI harness overlay manifest
        required: true
        type: string
      issue_2825_harness_overlay_manifest_sha256:
        description: SHA-256 of the trusted #2825 CI harness overlay manifest
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_bugfix-full-ci-matrix.yml
    with:
      issue: ${{ inputs.issue }}
      source-sha: ${{ inputs.source_sha }}
      evidence-definition-sha: ${{ inputs.evidence_definition_sha }}
      quarantine-sha256: ${{ inputs.quarantine_sha256 }}
      harness-overlay-manifest-sha256: ${{ inputs.harness_overlay_manifest_sha256 }}
      issue-2825-harness-overlay-manifest-sha256: ${{ inputs.issue_2825_harness_overlay_manifest_sha256 }}

  repro-runner:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reprorunner.yml
    with:
      # Temporary compile blocker; exact coverage gap is in full-ci-quarantine.json.
      filter: '^(?!Issue_2854_CircularPageList$).*'
      ref: ${{ inputs.source_sha }}
      evidence_definition_sha: ${{ inputs.evidence_definition_sha }}
      issue_2794_harness_overlay: true
      issue_2825_harness_overlay: true
