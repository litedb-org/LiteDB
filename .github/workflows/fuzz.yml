name: P5 exact candidate safety campaign
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  campaign:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          id: linux-0
          mode: fuzz
          targets: api-boundary,compact-codec,index,page,recovery,transaction
        - os: ubuntu-latest
          id: linux-1
          mode: fuzz
          targets: boundary,compact-crash,integrity,parser,shared-wake,transaction-gate
        - os: ubuntu-latest
          id: linux-2
          mode: fuzz
          targets: bson,compact-power-loss,linq-cache,power-loss,snapshot,transaction-handle
        - os: ubuntu-latest
          id: linux-3
          mode: fuzz
          targets: chaos,compact-storage,malformed-file,pressure,sort,value
        - os: ubuntu-latest
          id: linux-4
          mode: fuzz
          targets: checksum-crash,compatibility,mapper,query,sql-dml,vector
        - os: ubuntu-latest
          id: linux-5
          mode: fuzz
          targets: checksum-migration,concurrent,mvcc-checkpoint,read-only,storage,wal
        - os: ubuntu-latest
          id: linux-6
          mode: fuzz
          targets: checksum-page,conflict,mvcc-retirement,rebuild,storage-failure
        - os: ubuntu-latest
          id: linux-7
          mode: fuzz
          targets: checksum-wal,cursor-handoff,oracle-selftest,rebuild-transition,threaded-snapshot
        - os: windows-latest
          id: windows-0
          mode: fuzz
          targets: api-boundary,compact-codec,index,page,recovery,transaction
        - os: windows-latest
          id: windows-1
          mode: fuzz
          targets: boundary,compact-crash,integrity,parser,shared-wake,transaction-gate
        - os: windows-latest
          id: windows-2
          mode: fuzz
          targets: bson,compact-power-loss,linq-cache,power-loss,snapshot,transaction-handle
        - os: windows-latest
          id: windows-3
          mode: fuzz
          targets: chaos,compact-storage,malformed-file,pressure,sort,value
        - os: windows-latest
          id: windows-4
          mode: fuzz
          targets: checksum-crash,compatibility,mapper,query,sql-dml,vector
        - os: windows-latest
          id: windows-5
          mode: fuzz
          targets: checksum-migration,concurrent,mvcc-checkpoint,read-only,storage,wal
        - os: windows-latest
          id: windows-6
          mode: fuzz
          targets: checksum-page,conflict,mvcc-retirement,rebuild,storage-failure
        - os: windows-latest
          id: windows-7
          mode: fuzz
          targets: checksum-wal,cursor-handoff,oracle-selftest,rebuild-transition,threaded-snapshot
        - os: macos-15
          id: macos-shared-handle
          mode: fuzz
          targets: shared,shared-legacy,shared-wake,transaction-handle
        - os: ubuntu-latest
          id: linux-faults
          mode: faults
          targets: ''
        - os: windows-latest
          id: windows-faults
          mode: faults
          targets: ''
        - os: macos-15
          id: macos-faults
          mode: faults
          targets: ''
    env:
      LITEDB_HANDLE_CLOSE_ROUNDS: '120'
    steps:
    - uses: actions/checkout@v4
      with:
        path: driver
    - uses: actions/checkout@v4
      with:
        ref: e507faad40e968aa2fcf63ae6dd01fd7def2e07b
        path: candidate
        fetch-depth: 0
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x

          10.0.x'
    - name: Build exact candidate
      working-directory: candidate
      run: dotnet build LiteDB.Fuzz/LiteDB.Fuzz.csproj -c Release -f net8.0 -p:TestingEnabled=true
        -p:GitVersionEnabled=false
    - name: Build registered fault tests
      if: matrix.mode == 'faults'
      working-directory: candidate
      run: dotnet build LiteDB.Tests/LiteDB.Tests.csproj -c Release -f net8.0 -p:TestingEnabled=true
        -p:GitVersionEnabled=false
    - name: Run complete bounded campaign and replay failures
      working-directory: candidate
      run: python ../driver/.github/scripts/p5/campaign.py "${{ matrix.mode }}" --targets
        "${{ matrix.targets }}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: p5-${{ matrix.id }}
        path: 'candidate/evidence

          candidate/LiteDB.Fuzz/bin/Release/net8.0

          candidate/LiteDB.Tests/bin/Release/net8.0'
        retention-days: 14
        if-no-files-found: error
