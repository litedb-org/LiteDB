name: F-P5 macOS crash-cut classification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        revision: [e507faad4, ae2eae2af0e485b892d2467699c9bb5dcfb37d60]
    runs-on: macos-15
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
          path: source
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Record exact source and environment
        run: |
          mkdir -p "$RUNNER_TEMP/f-p5-macos-cut"
          git -C source rev-parse HEAD > "$RUNNER_TEMP/f-p5-macos-cut/product-sha.txt"
          dotnet --info > "$RUNNER_TEMP/f-p5-macos-cut/dotnet-info.txt"
          sw_vers > "$RUNNER_TEMP/f-p5-macos-cut/macos.txt"
      - name: Build and retain unmodified replay binary
        run: |
          dotnet build source/LiteDB.Fuzz -c Release -f net8.0 -p:TestingEnabled=true -p:GitVersionEnabled=false
          cp -R source/LiteDB.Fuzz/bin/Release/net8.0 "$RUNNER_TEMP/f-p5-macos-cut/original-binary"
          shasum -a 256 "$RUNNER_TEMP/f-p5-macos-cut/original-binary/"*.dll > "$RUNNER_TEMP/f-p5-macos-cut/original-sha256.txt"
      - name: Add scratch-only diagnostic harness
        run: python3 research/f-p5-macos-cut/prepare.py
      - name: Build net8 with engine hooks
        run: dotnet build source/LiteDB.Fuzz -c Release -f net8.0 -p:TestingEnabled=true -p:GitVersionEnabled=false
      - name: Direct forced admission and retained seed replay
        run: python3 research/f-p5-macos-cut/run.py
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-cut-${{ matrix.revision }}
          path: ${{ runner.temp }}/f-p5-macos-cut
          retention-days: 14
